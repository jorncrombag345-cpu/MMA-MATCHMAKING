<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankings - MMA Matchmaker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #111;
            border-bottom: 2px solid #e10600;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #e10600;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e10600;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .controls {
            background: #151515;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        select {
            width: 100%;
            max-width: 400px;

            padding: 12px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 6px;
        }

        .champion {
            background: linear-gradient(
                135deg,
                #2b2200,
                #151515
            );

            border: 1px solid #8f7200;

            border-radius: 10px;

            padding: 25px;

            margin-bottom: 25px;

            text-align: center;
        }

        .champion h2 {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .champion-name {
            font-size: 28px;
            font-weight: bold;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-item {
            background: #151515;

            border: 1px solid #292929;

            border-radius: 8px;

            padding: 18px;

            display: flex;
            align-items: center;

            gap: 20px;
        }

        .position {
            width: 45px;

            font-size: 22px;
            font-weight: bold;

            color: #777;
        }

        .fighter-info {
            flex: 1;
        }

        .fighter-name {
            font-size: 18px;
            font-weight: bold;
        }

        .fighter-record {
            color: #888;
            margin-top: 5px;
            font-size: 14px;
        }

        .edit-button {
            background: #e10600;

            border: none;

            color: white;

            padding: 10px 15px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        .edit-button:hover {
            background: #ff211a;
        }

        .empty {
            background: #151515;

            padding: 25px;

            border-radius: 10px;

            color: #777;

            text-align: center;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .ranking-item {
                flex-wrap: wrap;
            }

            .edit-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        MMA <span>MATCHMAKER</span>
    </div>

    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="#">
            Events
        </a>

        <a href="#">
            Matchmaker
        </a>

    </nav>

</header>


<div class="container">

    <h1>
        🏆 Rankings
    </h1>


    <div class="controls">

        <h3>
            Gewichtsklasse
        </h3>

        <br>

        <select
            id="weightClass"
            onchange="displayRankings()"
        >

            <option>
                Flyweight
            </option>

            <option>
                Bantamweight
            </option>

            <option>
                Featherweight
            </option>

            <option>
                Lightweight
            </option>

            <option>
                Welterweight
            </option>

            <option>
                Middleweight
            </option>

            <option>
                Light Heavyweight
            </option>

            <option>
                Heavyweight
            </option>

        </select>

    </div>


    <div id="champion"></div>


    <div id="rankingList"
         class="ranking-list">
    </div>

</div>


<script>


/*
==================================================
FIGHTERS UIT LOCALSTORAGE
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem("fighters")
    ) || [];


/*
==================================================
CHAMPIONS UIT LOCALSTORAGE
==================================================
*/

let champions =
    JSON.parse(
        localStorage.getItem("champions")
    ) || {};


/*
==================================================
CHAMPIONS OPSLAAN
==================================================
*/

function saveChampions() {

    localStorage.setItem(
        "champions",
        JSON.stringify(champions)
    );

}


/*
==================================================
CHAMPION INSTELLEN
==================================================
*/

function setChampion(weightClass) {

    const availableFighters =
        fighters.filter(
            fighter =>
                fighter.weightClass === weightClass
        );


    if (availableFighters.length === 0) {

        alert(
            "Voeg eerst een fighter toe in deze gewichtsklasse."
        );

        return;

    }


    let options =
        availableFighters
            .map(
                fighter =>
                    fighter.name
            )
            .join("\n");


    const currentChampion =
        champions[weightClass] || "";


    const name =
        prompt(
            "Typ de naam van de nieuwe champion:\n\n" +
            options,
            currentChampion
        );


    if (name === null) {

        return;

    }


    const fighter =
        availableFighters.find(
            fighter =>
                fighter.name.toLowerCase() ===
                name.toLowerCase()
        );


    if (!fighter) {

        alert(
            "Deze fighter bestaat niet in deze gewichtsklasse."
        );

        return;

    }


    champions[weightClass] =
        fighter.id;


    saveChampions();

    displayRankings();

}


/*
==================================================
RANKING AANPASSEN
==================================================
*/

function editRanking(id) {

    const fighter =
        fighters.find(
            fighter =>
                fighter.id === id
        );


    if (!fighter) {

        return;

    }


    const ranking =
        prompt(
            "Nieuwe ranking voor " +
            fighter.name +
            ":\n\n" +
            "Typ 1 t/m 15\n" +
            "Of laat leeg voor Unranked.",
            fighter.ranking || ""
        );


    if (ranking === null) {

        return;

    }


    if (ranking === "") {

        fighter.ranking = "";

    } else {

        const number =
            Number(ranking);


        if (
            !Number.isInteger(number) ||
            number < 1 ||
            number > 15
        ) {

            alert(
                "Ranking moet tussen 1 en 15 liggen."
            );

            return;

        }


        fighter.ranking = number;

    }


    localStorage.setItem(
        "fighters",
        JSON.stringify(fighters)
    );


    displayRankings();

}


/*
==================================================
RANKINGS WEERGEVEN
==================================================
*/

function displayRankings() {

    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const championContainer =
        document.getElementById(
            "champion"
        );


    const rankingContainer =
        document.getElementById(
            "rankingList"
        );


    /*
    ----------------------------------------------
    CHAMPION
    ----------------------------------------------
    */

    const championId =
        champions[weightClass];


    const champion =
        fighters.find(
            fighter =>
                fighter.id === championId
        );


    if (champion) {

        championContainer.innerHTML = `

            <div class="champion">

                <h2>
                    🏆 CHAMPION
                </h2>

                <div class="champion-name">
                    ${champion.name}
                </div>

                <p style="color:#aaa; margin-top:8px;">
                    ${weightClass}
                </p>

                <button
                    class="edit-button"
                    onclick="setChampion('${weightClass}')"
                    style="margin-top:15px;"
                >
                    Champion wijzigen
                </button>

            </div>

        `;

    } else {

        championContainer.innerHTML = `

            <div class="champion">

                <h2>
                    🏆 CHAMPION
                </h2>

                <div class="champion-name">
                    Vacant
                </div>

                <button
                    class="edit-button"
                    onclick="setChampion('${weightClass}')"
                    style="margin-top:15px;"
                >
                    Champion instellen
                </button>

            </div>

        `;

    }


    /*
    ----------------------------------------------
    RANKED FIGHTERS
    ----------------------------------------------
    */

    const rankedFighters =
        fighters
            .filter(
                fighter =>
                    fighter.weightClass ===
                    weightClass
            )
            .filter(
                fighter =>
                    fighter.ranking &&
                    Number(fighter.ranking) >= 1 &&
                    Number(fighter.ranking) <= 15
            )
            .sort(
                (a, b) =>
                    Number(a.ranking) -
                    Number(b.ranking)
            );


    rankingContainer.innerHTML = "";


    /*
    ----------------------------------------------
    GEEN RANKINGS
    ----------------------------------------------
    */

    if (rankedFighters.length === 0) {

        rankingContainer.innerHTML = `

            <div class="empty">

                Nog geen fighters gerankt in
                ${weightClass}.

                <br><br>

                Voeg eerst fighters toe en geef ze
                een ranking.

            </div>

        `;

        return;

    }


    /*
    ----------------------------------------------
    RANKING ITEMS
    ----------------------------------------------
    */

    rankedFighters.forEach(
        fighter => {

            rankingContainer.innerHTML += `

                <div class="ranking-item">

                    <div class="position">

                        #${fighter.ranking}

                    </div>


                    <div class="fighter-info">

                        <div class="fighter-name">

                            ${fighter.name}

                        </div>


                        <div class="fighter-record">

                            Record:

                            ${fighter.wins}-
                            ${fighter.losses}-
                            ${fighter.draws}

                            &nbsp; | &nbsp;

                            Win streak:
                            ${fighter.streak}

                        </div>

                    </div>


                    <button
                        class="edit-button"
                        onclick="editRanking(${fighter.id})"
                    >

                        ✏️ Ranking

                    </button>

                </div>

            `;

        }
    );

}


/*
==================================================
PAGINA STARTEN
==================================================
*/

displayRankings();


</script>


</body>
</html>
