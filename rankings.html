<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rankings - MMA Matchmaker</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1a1a1a 0%,
                    #090909 45%,
                    #050505 100%
                );

            color: white;

            min-height: 100vh;

        }


        header {

            background: rgba(17,17,17,.96);

            border-bottom:
                2px solid #e10600;

            padding: 18px 35px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            position: sticky;

            top: 0;

            z-index: 100;

            backdrop-filter:
                blur(10px);

        }


        .logo {

            font-size: 24px;

            font-weight: 900;

            letter-spacing: .5px;

        }


        .logo span {

            color: #e10600;

        }


        nav {

            display: flex;

            flex-wrap: wrap;

            justify-content:
                flex-end;

            gap: 18px;

        }


        nav a {

            color: #aaa;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            transition: .2s;

        }


        nav a:hover,
        nav a.active {

            color: white;

        }


        nav a.active {

            color: #e10600;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 45px 20px 70px;

        }


        .hero {

            margin-bottom: 30px;

        }


        .eyebrow {

            color: #e10600;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 10px;

        }


        h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #777;

            line-height: 1.6;

        }


        .card {

            background:
                linear-gradient(
                    145deg,
                    #171717,
                    #101010
                );

            border:
                1px solid #292929;

            border-radius: 14px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.25);

        }


        .card-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

        }


        .card h2 {

            font-size: 21px;

        }


        .division {

            margin-bottom: 30px;

        }


        .division:last-child {

            margin-bottom: 0;

        }


        .division-title {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 12px;

            padding-bottom: 12px;

            border-bottom:
                1px solid #292929;

        }


        .division-title h3 {

            font-size: 20px;

        }


        .division-title span {

            color: #777;

            font-size: 13px;

        }


        .champion {

            background:
                linear-gradient(
                    135deg,
                    #241f08,
                    #111
                );

            border:
                1px solid #6b5900;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 12px;

            display: flex;

            align-items: center;

            gap: 18px;

        }


        .champion-rank {

            width: 55px;

            height: 55px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #ffd700;

            color: #111;

            font-size: 20px;

            font-weight: 900;

            flex-shrink: 0;

        }


        .champion-info {

            flex: 1;

        }


        .champion-info strong {

            display: block;

            font-size: 20px;

            margin-bottom: 5px;

        }


        .champion-info small {

            color: #aaa;

        }


        .champion-badge {

            color: #ffd700;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1px;

        }


        .ranking-list {

            display: grid;

            gap: 8px;

        }


        .ranking-item {

            background: #101010;

            border:
                1px solid #292929;

            border-radius: 9px;

            padding: 15px;

            display: flex;

            align-items: center;

            gap: 15px;

            transition: .2s;

        }


        .ranking-item:hover {

            border-color: #444;

            transform:
                translateY(-1px);

        }


        .rank-number {

            width: 45px;

            text-align: center;

            font-size: 18px;

            font-weight: 900;

            color: #e10600;

            flex-shrink: 0;

        }


        .fighter-info {

            flex: 1;

        }


        .fighter-info strong {

            display: block;

            font-size: 17px;

            margin-bottom: 5px;

        }


        .fighter-info small {

            color: #777;

        }


        .record {

            color: #aaa;

            font-size: 13px;

            text-align: right;

        }


        .streak {

            color: #6ee7a0;

            font-weight: bold;

            font-size: 12px;

            margin-top: 4px;

        }


        .unranked-section {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid #333;

        }


        .unranked-title {

            color: #777;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 10px;

        }


        .unranked-item {

            opacity: .75;

            background: #0d0d0d;

            border:
                1px solid #222;

        }


        .unranked-rank {

            color: #555;

        }


        .empty {

            color: #666;

            text-align: center;

            padding: 25px;

        }


        .search {

            width: 100%;

            padding: 14px 16px;

            background: #0d0d0d;

            color: white;

            border:
                1px solid #333;

            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 25px;

        }


        .search:focus {

            outline: none;

            border-color: #e10600;

        }


        @media (max-width: 750px) {

            header {

                flex-direction: column;

                gap: 18px;

            }


            nav {

                justify-content: center;

                gap: 10px;

            }


            h1 {

                font-size: 30px;

            }


            .card {

                padding: 18px;

            }


            .ranking-item {

                gap: 10px;

            }


            .record {

                display: none;

            }


            .champion {

                padding: 14px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        MMA
        <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a
            href="rankings.html"
            class="active"
        >
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fighter-profile.html">
            Profiles
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<div class="container">


    <div class="hero">

        <div class="eyebrow">
            MMA MATCHMAKER
        </div>

        <h1>
            🏆 Rankings
        </h1>

        <p class="subtitle">

            Bekijk de actuele rankings per
            gewichtsklasse.

            Unranked fighters staan altijd
            onder de laagst gerankte fighter.

        </p>

    </div>


    <div class="card">

        <input
            id="search"
            class="search"
            type="text"
            placeholder="🔎 Zoek een fighter..."
            oninput="renderRankings()"
        >


        <div id="rankings"></div>

    </div>


</div>


<script>


/*
==================================================
DATA
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem(
            "fighters"
        )
    ) || [];


/*
==================================================
DATA VERNIEUWEN
==================================================
*/

function loadData() {

    fighters =
        JSON.parse(
            localStorage.getItem(
                "fighters"
            )
        ) || [];

}


/*
==================================================
RANKING WAARDE
==================================================

Belangrijk:

#1 = hoogste

#15 = laagste

Unranked = Infinity

Daardoor komt Unranked ALTIJD
onder alle gerankte fighters.
*/

function getRankingValue(
    fighter
) {

    const value =
        Number(
            fighter.ranking
        );


    if (
        fighter.ranking === null ||
        fighter.ranking === undefined ||
        fighter.ranking === "" ||
        !Number.isFinite(value) ||
        value < 1
    ) {

        return Infinity;

    }


    return value;

}


/*
==================================================
RANKING SORTEREN
==================================================
*/

function sortRankings(
    list
) {

    return [...list].sort(
        (a, b) => {

            const rankA =
                getRankingValue(a);

            const rankB =
                getRankingValue(b);


            /*
            --------------------------------------
            Beide gerankt
            --------------------------------------
            */

            if (
                rankA !== Infinity &&
                rankB !== Infinity
            ) {

                return rankA - rankB;

            }


            /*
            --------------------------------------
            A gerankt, B unranked
            --------------------------------------
            */

            if (
                rankA !== Infinity &&
                rankB === Infinity
            ) {

                return -1;

            }


            /*
            --------------------------------------
            A unranked, B gerankt
            --------------------------------------
            */

            if (
                rankA === Infinity &&
                rankB !== Infinity
            ) {

                return 1;

            }


            /*
            --------------------------------------
            Beide unranked
            --------------------------------------
            */

            return (
                String(a.name || "")
                    .localeCompare(
                        String(b.name || "")
                    )
            );

        }
    );

}


/*
==================================================
GEWICHTSKLASSEN
==================================================
*/

const weightClasses = [

    "Flyweight",

    "Bantamweight",

    "Featherweight",

    "Lightweight",

    "Welterweight",

    "Middleweight",

    "Light Heavyweight",

    "Heavyweight"

];


/*
==================================================
FIGHTER RECORD
==================================================
*/

function getRecord(
    fighter
) {

    const wins =
        Number(fighter.wins) || 0;

    const losses =
        Number(fighter.losses) || 0;

    const draws =
        Number(fighter.draws) || 0;


    return (
        wins +
        "-" +
        losses +
        "-" +
        draws
    );

}


/*
==================================================
RENDER
==================================================
*/

function renderRankings() {

    loadData();


    const container =
        document.getElementById(
            "rankings"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    container.innerHTML = "";


    let foundAnything =
        false;


    weightClasses.forEach(
        weightClass => {


            /*
            --------------------------------------
            Fighters uit deze divisie
            --------------------------------------
            */

            let division =
                fighters.filter(
                    fighter =>
                        fighter.weightClass ===
                        weightClass
                );


            /*
            --------------------------------------
            Zoekfilter
            --------------------------------------
            */

            if (search) {

                division =
                    division.filter(
                        fighter =>
                            String(
                                fighter.name || ""
                            )
                            .toLowerCase()
                            .includes(
                                search
                            )
                    );

            }


            /*
            --------------------------------------
            Geen fighters
            --------------------------------------
            */

            if (
                division.length === 0
            ) {

                return;

            }


            foundAnything =
                true;


            /*
            --------------------------------------
            Sorteren
            --------------------------------------
            */

            division =
                sortRankings(
                    division
                );


            /*
            --------------------------------------
            Champion zoeken
            --------------------------------------
            */

            const champion =
                division.find(
                    fighter =>
                        fighter.champion === true
                );


            /*
            --------------------------------------
            Gerankte fighters
            --------------------------------------
            */

            const ranked =
                division.filter(
                    fighter =>
                        getRankingValue(
                            fighter
                        ) !== Infinity &&
                        fighter.champion !== true
                );


            /*
            --------------------------------------
            Unranked
            --------------------------------------
            */

            const unranked =
                division.filter(
                    fighter =>
                        getRankingValue(
                            fighter
                        ) === Infinity &&
                        fighter.champion !== true
                );


            /*
            --------------------------------------
            DIVISION HTML
            --------------------------------------
            */

            const section =
                document.createElement(
                    "div"
                );


            section.className =
                "division";


            let html = `

                <div class="division-title">

                    <h3>
                        ${weightClass}
                    </h3>

                    <span>
                        ${division.length} fighters
                    </span>

                </div>

            `;


            /*
            --------------------------------------
            CHAMPION
            --------------------------------------
            */

            if (champion) {

                html += `

                    <div class="champion">

                        <div class="champion-rank">
                            🏆
                        </div>


                        <div class="champion-info">

                            <strong>
                                ${escapeHTML(
                                    champion.name
                                )}
                            </strong>

                            <small>

                                Record:
                                ${getRecord(
                                    champion
                                )}

                            </small>

                        </div>


                        <div class="champion-badge">

                            CHAMPION

                        </div>

                    </div>

                `;

            }


            /*
            --------------------------------------
            RANKED LIST
            --------------------------------------
            */

            if (
                ranked.length > 0
            ) {

                html += `

                    <div class="ranking-list">

                `;


                ranked.forEach(
                    fighter => {

                        html +=
                            createRankingHTML(
                                fighter
                            );

                    }
                );


                html += `

                    </div>

                `;

            }


            /*
            --------------------------------------
            UNRANKED
            --------------------------------------
            */

            if (
                unranked.length > 0
            ) {

                html += `

                    <div class="unranked-section">

                        <div class="unranked-title">

                            UNRANKED

                        </div>


                        <div class="ranking-list">

                `;


                unranked.forEach(
                    fighter => {

                        html += `

                            <div
                                class="
                                    ranking-item
                                    unranked-item
                                "
                            >

                                <div
                                    class="
                                        rank-number
                                        unranked-rank
                                    "
                                >

                                    —

                                </div>


                                <div
                                    class="fighter-info"
                                >

                                    <strong>

                                        ${escapeHTML(
                                            fighter.name
                                        )}

                                    </strong>


                                    <small>

                                        ${weightClass}

                                    </small>

                                </div>


                                <div
                                    class="record"
                                >

                                    Record:

                                    ${getRecord(
                                        fighter
                                    )}


                                    ${
                                        Number(
                                            fighter.streak
                                        ) > 0
                                            ? `
                                                <div class="streak">

                                                    🔥
                                                    ${Number(
                                                        fighter.streak
                                                    )}
                                                    win streak

                                                </div>
                                            `
                                            : ""
                                    }

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                        </div>

                    </div>

                `;

            }


            section.innerHTML =
                html;


            container.appendChild(
                section
            );

        }
    );


    /*
    --------------------------------------
    GEEN RESULTATEN
    --------------------------------------
    */

    if (!foundAnything) {

        container.innerHTML = `

            <div class="empty">

                Geen fighters gevonden.

            </div>

        `;

    }

}


/*
==================================================
RANKED FIGHTER HTML
==================================================
*/

function createRankingHTML(
    fighter
) {

    const ranking =
        Number(
            fighter.ranking
        );


    const record =
        getRecord(
            fighter
        );


    const streak =
        Number(
            fighter.streak
        ) || 0;


    return `

        <div class="ranking-item">


            <div class="rank-number">

                #${ranking}

            </div>


            <div class="fighter-info">

                <strong>

                    ${escapeHTML(
                        fighter.name
                    )}

                </strong>


                <small>

                    ${fighter.weightClass}

                </small>

            </div>


            <div class="record">

                Record:
                ${record}


                ${
                    streak > 0
                        ? `
                            <div class="streak">

                                🔥
                                ${streak}
                                win streak

                            </div>
                        `
                        : ""
                }

            </div>


        </div>

    `;

}


/*
==================================================
HTML VEILIG MAKEN
==================================================
*/

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/*
==================================================
START
==================================================
*/

renderRankings();


/*
==================================================
AUTOMATISCH VERNIEUWEN
==================================================

Als je vanuit Admin een fighter
aanpast en daarna teruggaat naar
deze pagina, worden de gegevens
opnieuw ingelezen.
*/

window.addEventListener(
    "storage",
    function() {

        renderRankings();

    }
);


</script>


</body>

</html>
