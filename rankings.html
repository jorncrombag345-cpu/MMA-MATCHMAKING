<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rankings - MMA Matchmaker</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #0b0b0b;

            color: white;

        }


        header {

            background: #111;

            border-bottom:
                2px solid #e10600;

            padding:
                20px 40px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #e10600;

        }


        nav a {

            color: white;

            text-decoration: none;

            margin-left: 20px;

            font-weight: bold;

        }


        nav a:hover {

            color: #e10600;

        }


        .container {

            max-width: 1000px;

            margin: auto;

            padding:
                40px 20px;

        }


        h1 {

            margin-bottom: 10px;

        }


        .subtitle {

            color: #888;

            margin-bottom: 30px;

        }


        .selector {

            background: #151515;

            border:
                1px solid #292929;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 25px;

        }


        select {

            width: 100%;

            padding: 13px;

            margin-top: 10px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 6px;

        }


        .champion {

            background:
                linear-gradient(
                    135deg,
                    #211b05,
                    #111
                );

            border:
                1px solid #8d7210;

            border-radius: 12px;

            padding: 30px;

            text-align: center;

            margin-bottom: 25px;

        }


        .champion-label {

            color: #ffd700;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 2px;

        }


        .champion-name {

            font-size: 32px;

            font-weight: bold;

            margin-top: 10px;

        }


        .champion-record {

            color: #aaa;

            margin-top: 8px;

        }


        .rankings {

            display: flex;

            flex-direction: column;

            gap: 10px;

        }


        .rank {

            display: grid;

            grid-template-columns:
                70px 1fr 160px 120px;

            align-items: center;

            gap: 15px;

            background: #151515;

            border:
                1px solid #292929;

            border-radius: 8px;

            padding: 18px;

        }


        .position {

            font-size: 24px;

            font-weight: bold;

            text-align: center;

            color: #777;

        }


        .fighter-name {

            font-size: 18px;

            font-weight: bold;

        }


        .record {

            color: #aaa;

        }


        .streak {

            color: #35d07f;

            text-align: right;

        }


        .empty {

            background: #151515;

            color: #777;

            padding: 30px;

            text-align: center;

            border-radius: 10px;

        }


        @media (max-width: 700px) {

            header {

                flex-direction: column;

                gap: 20px;

            }


            nav {

                text-align: center;

            }


            nav a {

                display: inline-block;

                margin: 5px;

            }


            .rank {

                grid-template-columns:
                    50px 1fr;

            }


            .record,
            .streak {

                text-align: left;

            }

        }

    </style>

</head>


<body>


<header>


    <div class="logo">

        MMA
        <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fighter-profile.html">
            Profiles
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<div class="container">


    <h1>
        🏆 Rankings
    </h1>


    <p class="subtitle">

        Bekijk de rankings per gewichtsklasse.

    </p>


    <!-- GEWICHTSKLASSE -->


    <div class="selector">

        <strong>
            Gewichtsklasse
        </strong>


        <select
            id="weightClass"
            onchange="displayRankings()"
        >

            <option>
                Flyweight
            </option>

            <option>
                Bantamweight
            </option>

            <option>
                Featherweight
            </option>

            <option>
                Lightweight
            </option>

            <option>
                Welterweight
            </option>

            <option>
                Middleweight
            </option>

            <option>
                Light Heavyweight
            </option>

            <option>
                Heavyweight
            </option>

        </select>

    </div>


    <!-- CHAMPION -->


    <div
        id="champion"
        class="champion"
    ></div>


    <!-- RANKINGS -->


    <div
        id="rankings"
        class="rankings"
    ></div>


</div>


<script>


/*
==================================================
DATA
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem("fighters")
    ) || [];


/*
==================================================
RANKINGS WEERGEVEN
==================================================
*/

function displayRankings() {

    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const championBox =
        document.getElementById(
            "champion"
        );


    const rankingsBox =
        document.getElementById(
            "rankings"
        );


    /*
    ------------------------------------------
    FILTER
    ------------------------------------------
    */

    const division =
        fighters.filter(
            fighter =>
                fighter.weightClass ===
                weightClass
        );


    /*
    ------------------------------------------
    CHAMPION
    ------------------------------------------
    */

    const champion =
        division.find(
            fighter =>
                fighter.champion === true
        );


    if (champion) {

        championBox.innerHTML = `

            <div class="champion-label">

                🏆 CHAMPION

            </div>


            <div class="champion-name">

                ${champion.name}

            </div>


            <div class="champion-record">

                Record:
                ${champion.wins}-${champion.losses}-${champion.draws}

            </div>

        `;

    }

    else {

        championBox.innerHTML = `

            <div class="champion-label">

                🏆 CHAMPION

            </div>


            <div class="champion-name">

                Vacant

            </div>


            <div class="champion-record">

                Nog geen kampioen

            </div>

        `;

    }


    /*
    ------------------------------------------
    RANKED FIGHTERS
    ------------------------------------------
    */

    const ranked =
        division
            .filter(
                fighter =>
                    fighter.ranking
            )
            .sort(
                (a, b) =>
                    a.ranking -
                    b.ranking
            );


    rankingsBox.innerHTML = "";


    if (ranked.length === 0) {

        rankingsBox.innerHTML = `

            <div class="empty">

                Nog geen gerankte fighters
                in deze divisie.

            </div>

        `;

        return;

    }


    /*
    ------------------------------------------
    MAX 15
    ------------------------------------------
    */

    ranked
        .slice(0, 15)
        .forEach(
            fighter => {


                rankingsBox.innerHTML += `

                    <div class="rank">


                        <div class="position">

                            #${fighter.ranking}

                        </div>


                        <div>

                            <div class="fighter-name">

                                ${fighter.name}

                            </div>

                        </div>


                        <div class="record">

                            ${fighter.wins}
                            -
                            ${fighter.losses}
                            -
                            ${fighter.draws}

                        </div>


                        <div class="streak">

                            🔥
                            ${fighter.streak || 0}
                            streak

                        </div>


                    </div>

                `;

            }
        );

}


/*
==================================================
START
==================================================
*/

displayRankings();


</script>


</body>

</html>
