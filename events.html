<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events - MMA Matchmaker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #090909;
            color: white;
        }

        header {
            background: #111;
            border-bottom: 2px solid #e10600;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #e10600;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #e10600;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 7px;

            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #e10600;
        }

        button {
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        .main-button {
            width: 100%;

            padding: 15px;

            background: #e10600;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;
        }

        .main-button:hover {
            background: #ff211a;
        }

        .clear-button {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 7px;

            font-size: 15px;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 14px;

            border-radius: 7px;

            text-align: center;
        }

        .success {
            background: #12351f;
            border: 1px solid #1f7540;
            color: #6ee7a0;
        }

        .error {
            background: #3a1111;
            border: 1px solid #6d2222;
            color: #ff8b8b;
        }

        .events {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .event {
            background: #101010;

            border: 1px solid #333;
            border-radius: 10px;

            padding: 22px;
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 15px;
        }

        .event-name {
            font-size: 24px;
            font-weight: bold;
        }

        .event-date {
            color: #aaa;
            margin-top: 8px;
            line-height: 1.6;
        }

        .event-description {
            color: #888;
            margin-top: 15px;
            line-height: 1.5;
        }

        .status {
            padding: 6px 10px;

            border-radius: 5px;

            font-size: 11px;
            font-weight: bold;
        }

        .upcoming {
            background: #12351f;
            color: #6ee7a0;
        }

        .past {
            background: #292929;
            color: #aaa;
        }

        .actions {
            display: flex;
            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;
        }

        .action-button {
            padding: 10px 14px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 6px;
        }

        .action-button:hover {
            background: #333;
        }

        .delete:hover {
            background: #5a1515;
            border-color: #7a2222;
        }

        .fight-box {
            display: none;

            margin-top: 20px;
            padding-top: 20px;

            border-top: 1px solid #292929;
        }

        .fight {
            background: #171717;

            border: 1px solid #333;
            border-radius: 8px;

            padding: 15px;

            margin-bottom: 10px;
        }

        .fight:last-child {
            margin-bottom: 0;
        }

        .fight-number {
            color: #777;
            font-size: 12px;

            margin-bottom: 8px;
        }

        .fight-names {
            font-size: 18px;
            font-weight: bold;
        }

        .fight-names span {
            color: #e10600;
            margin: 0 8px;
        }

        .fight-info {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }

        .result {
            color: #6ee7a0;
            margin-top: 8px;
            font-size: 13px;
        }

        .empty {
            padding: 30px;

            text-align: center;

            color: #777;

            background: #111;

            border-radius: 8px;
        }

        .danger-box {
            margin-top: 30px;

            padding: 15px;

            background: #1b1010;

            border: 1px solid #4b2222;

            border-radius: 8px;
        }

        .danger-button {
            margin-top: 10px;

            padding: 10px 15px;

            background: #5a1515;

            color: white;

            border: 1px solid #7a2222;

            border-radius: 6px;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
            }

            nav {
                justify-content: center;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .event-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        MMA <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">Home</a>

        <a href="fighters.html">Fighters</a>

        <a href="rankings.html">Rankings</a>

        <a href="events.html">Events</a>

        <a href="matchmaker.html">Matchmaker</a>

        <a href="fight-result.html">Results</a>

        <a href="fighter-profile.html">Profiles</a>

        <a href="admin.html">Admin</a>

    </nav>

</header>


<main class="container">


    <h1>📅 Events</h1>

    <p class="subtitle">
        Maak en beheer je eigen MMA-events.
    </p>


    <!-- NIEUW EVENT -->

    <div class="card">

        <h2>Nieuw Event</h2>


        <div class="form-grid">


            <div>

                <label for="eventName">
                    Eventnaam
                </label>

                <input
                    id="eventName"
                    type="text"
                    placeholder="Bijv. MMA 300"
                >

            </div>


            <div>

                <label for="eventDate">
                    Datum
                </label>

                <input
                    id="eventDate"
                    type="date"
                >

            </div>


            <div>

                <label for="eventLocation">
                    Locatie
                </label>

                <input
                    id="eventLocation"
                    type="text"
                    placeholder="Bijv. Ziggo Dome"
                >

            </div>


            <div>

                <label for="eventCity">
                    Stad / Land
                </label>

                <input
                    id="eventCity"
                    type="text"
                    placeholder="Bijv. Amsterdam, Nederland"
                >

            </div>


            <div class="full">

                <label for="eventDescription">
                    Beschrijving
                </label>

                <textarea
                    id="eventDescription"
                    placeholder="Beschrijving van het event..."
                ></textarea>

            </div>


            <div class="full">

                <button
                    type="button"
                    class="main-button"
                    onclick="createEvent()"
                >

                    ➕ EVENT MAKEN

                </button>


                <button
                    type="button"
                    class="clear-button"
                    onclick="clearForm()"
                >

                    Wissen

                </button>


                <div
                    id="success"
                    class="message success"
                ></div>


                <div
                    id="error"
                    class="message error"
                ></div>

            </div>

        </div>

    </div>


    <!-- EVENT LIJST -->

    <div class="card">

        <h2>Alle Events</h2>


        <div
            id="eventList"
            class="events"
        ></div>


        <!-- DATA RESET -->

        <div class="danger-box">

            <strong>
                Problemen met oude data?
            </strong>

            <p style="color:#888; margin-top:7px;">
                Gebruik dit alleen als events
                verkeerd opgeslagen zijn.
            </p>


            <button
                type="button"
                class="danger-button"
                onclick="resetEvents()"
            >

                🗑️ Alle Events Wissen

            </button>

        </div>

    </div>


</main>


<script>

/*
==================================================
VEILIG DATA LADEN
==================================================
*/

function loadEvents() {

    try {

        const data =
            localStorage.getItem("events");


        if (!data) {

            return [];

        }


        const parsed =
            JSON.parse(data);


        if (
            !Array.isArray(parsed)
        ) {

            return [];

        }


        return parsed;

    }

    catch (error) {

        console.error(
            "Events konden niet worden geladen:",
            error
        );

        return [];

    }

}


/*
==================================================
EVENTS
==================================================
*/

let events =
    loadEvents();


/*
==================================================
FIGHTERS
==================================================
*/

function loadFighters() {

    try {

        const data =
            localStorage.getItem("fighters");


        if (!data) {

            return [];

        }


        const parsed =
            JSON.parse(data);


        if (
            !Array.isArray(parsed)
        ) {

            return [];

        }


        return parsed;

    }

    catch (error) {

        return [];

    }

}


let fighters =
    loadFighters();


/*
==================================================
OPSLAAN
==================================================
*/

function saveEvents() {

    localStorage.setItem(
        "events",
        JSON.stringify(events)
    );

}


/*
==================================================
EVENT MAKEN
==================================================
*/

function createEvent() {

    hideMessages();


    const name =
        document
            .getElementById("eventName")
            .value
            .trim();


    const date =
        document
            .getElementById("eventDate")
            .value;


    const location =
        document
            .getElementById("eventLocation")
            .value
            .trim();


    const city =
        document
            .getElementById("eventCity")
            .value
            .trim();


    const description =
        document
            .getElementById("eventDescription")
            .value
            .trim();


    /*
    ------------------------------------------
    CONTROLE
    ------------------------------------------
    */

    if (name === "") {

        showError(
            "Vul eerst een eventnaam in."
        );

        return;

    }


    if (date === "") {

        showError(
            "Kies eerst een datum."
        );

        return;

    }


    /*
    ------------------------------------------
    EVENT OBJECT
    ------------------------------------------
    */

    const newEvent = {

        id:
            Date.now(),

        name:
            name,

        date:
            date,

        location:
            location,

        city:
            city,

        description:
            description,

        fights:
            [],

        createdAt:
            new Date().toISOString()

    };


    /*
    ------------------------------------------
    EVENT TOEVOEGEN
    ------------------------------------------
    */

    events.push(
        newEvent
    );


    /*
    ------------------------------------------
    OPSLAAN
    ------------------------------------------
    */

    saveEvents();


    /*
    ------------------------------------------
    FORMULIER WISSEN
    ------------------------------------------
    */

    clearForm();


    /*
    ------------------------------------------
    LIJST OPNIEUW MAKEN
    ------------------------------------------
    */

    displayEvents();


    /*
    ------------------------------------------
    MELDING
    ------------------------------------------
    */

    showSuccess(
        "✅ " +
        name +
        " is aangemaakt!"
    );


    console.log(
        "Nieuw event:",
        newEvent
    );

}


/*
==================================================
EVENTS WEERGEVEN
==================================================
*/

function displayEvents() {

    /*
    Opnieuw laden zodat
    localStorage altijd leidend is.
    */

    events =
        loadEvents();


    const list =
        document.getElementById(
            "eventList"
        );


    list.innerHTML = "";


    /*
    ------------------------------------------
    GEEN EVENTS
    ------------------------------------------
    */

    if (
        events.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                📅 Nog geen events.

                <br><br>

                Maak hierboven je eerste
                event.

            </div>

        `;

        return;

    }


    /*
    ------------------------------------------
    SORTEREN
    ------------------------------------------
    */

    events.sort(
        function(a, b) {

            return String(a.date)
                .localeCompare(
                    String(b.date)
                );

        }
    );


    /*
    ------------------------------------------
    EVENTS MAKEN
    ------------------------------------------
    */

    events.forEach(
        function(event) {

            const status =
                getStatus(
                    event.date
                );


            const fights =
                Array.isArray(
                    event.fights
                )
                    ? event.fights
                    : [];


            const eventHTML = `

                <div
                    class="event"
                    id="event-${event.id}"
                >

                    <div class="event-top">

                        <div>

                            <div class="event-name">

                                ${escapeHTML(
                                    event.name
                                )}

                            </div>


                            <div class="event-date">

                                📅
                                ${formatDate(
                                    event.date
                                )}

                                <br>

                                ${
                                    event.location
                                    ? "📍 " +
                                      escapeHTML(
                                          event.location
                                      )
                                    : ""
                                }

                                ${
                                    event.city
                                    ? " • " +
                                      escapeHTML(
                                          event.city
                                      )
                                    : ""
                                }

                                <br>

                                🥊
                                ${fights.length}
                                fight(s)

                            </div>

                        </div>


                        <div
                            class="
                                status
                                ${status.className}
                            "
                        >

                            ${status.text}

                        </div>

                    </div>


                    ${
                        event.description
                        ? `

                            <div
                                class="event-description"
                            >

                                ${escapeHTML(
                                    event.description
                                )}

                            </div>

                          `
                        : ""
                    }


                    <div class="actions">

                        <button
                            type="button"
                            class="action-button"
                            onclick="
                                toggleFights(
                                    ${event.id}
                                )
                            "
                        >

                            🥊 Bekijk Fights

                        </button>


                        <button
                            type="button"
                            class="action-button"
                            onclick="
                                editEvent(
                                    ${event.id}
                                )
                            "
                        >

                            ✏️ Bewerken

                        </button>


                        <button
                            type="button"
                            class="
                                action-button
                                delete
                            "
                            onclick="
                                deleteEvent(
                                    ${event.id}
                                )
                            "
                        >

                            🗑️ Verwijderen

                        </button>

                    </div>


                    <div
                        id="fights-${event.id}"
                        class="fight-box"
                    ></div>

                </div>

            `;


            list.innerHTML +=
                eventHTML;

        }
    );

}


/*
==================================================
STATUS
==================================================
*/

function getStatus(date) {

    if (!date) {

        return {
            text: "Geen datum",
            className: "past"
        };

    }


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    const eventDate =
        new Date(
            date + "T00:00:00"
        );


    if (
        eventDate >= today
    ) {

        return {
            text: "UPCOMING",
            className: "upcoming"
        };

    }


    return {
        text: "PAST",
        className: "past"
    };

}


/*
==================================================
DATUM
==================================================
*/

function formatDate(date) {

    if (!date) {

        return "Geen datum";

    }


    const d =
        new Date(
            date + "T00:00:00"
        );


    if (
        isNaN(
            d.getTime()
        )
    ) {

        return date;

    }


    return d.toLocaleDateString(
        "nl-NL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/*
==================================================
FIGHTS
==================================================
*/

function toggleFights(eventId) {

    const box =
        document.getElementById(
            "fights-" + eventId
        );


    if (!box) {

        return;

    }


    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

        return;

    }


    displayFights(
        eventId
    );


    box.style.display =
        "block";

}


/*
==================================================
FIGHTS WEERGEVEN
==================================================
*/

function displayFights(eventId) {

    const box =
        document.getElementById(
            "fights-" + eventId
        );


    const event =
        events.find(
            function(e) {

                return String(e.id) ===
                    String(eventId);

            }
        );


    if (!event) {

        return;

    }


    const fights =
        Array.isArray(event.fights)
            ? event.fights
            : [];


    if (
        fights.length === 0
    ) {

        box.innerHTML = `

            <div class="empty">

                🥊 Nog geen fights.

                <br><br>

                We gaan hier later de
                Matchmaker aan koppelen.

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    fights.forEach(
        function(fight, index) {

            const fighterA =
                fighters.find(
                    function(fighter) {

                        return String(
                            fighter.id
                        ) === String(
                            fight.fighterA
                        );

                    }
                );


            const fighterB =
                fighters.find(
                    function(fighter) {

                        return String(
                            fighter.id
                        ) === String(
                            fight.fighterB
                        );

                    }
                );


            const nameA =
                fighterA
                    ? fighterA.name
                    : "Fighter A";


            const nameB =
                fighterB
                    ? fighterB.name
                    : "Fighter B";


            let resultHTML = "";


            if (
                fight.result
            ) {

                let winner =
                    "Resultaat";


                if (
                    fight.result.winner ===
                    "A"
                ) {

                    winner =
                        nameA +
                        " wint";

                }

                else if (
                    fight.result.winner ===
                    "B"
                ) {

                    winner =
                        nameB +
                        " wint";

                }

                else if (
                    fight.result.winner ===
                    "DRAW"
                ) {

                    winner =
                        "Draw";

                }

                else if (
                    fight.result.winner ===
                    "NC"
                ) {

                    winner =
                        "No Contest";

                }


                resultHTML = `

                    <div class="result">

                        🏆
                        ${escapeHTML(
                            winner
                        )}

                        ${
                            fight.result.method
                            ? " • " +
                              escapeHTML(
                                  fight.result.method
                              )
                            : ""
                        }

                    </div>

                `;

            }


            box.innerHTML += `

                <div class="fight">

                    <div class="fight-number">

                        FIGHT #${index + 1}

                    </div>


                    <div class="fight-names">

                        ${escapeHTML(nameA)}

                        <span>VS</span>

                        ${escapeHTML(nameB)}

                    </div>


                    <div class="fight-info">

                        ${escapeHTML(
                            fight.weightClass ||
                            "Onbekend"
                        )}

                        •
                        ${fight.rounds || 3}
                        rondes

                    </div>


                    ${resultHTML}

                </div>

            `;

        }
    );

}


/*
==================================================
EVENT BEWERKEN
==================================================
*/

function editEvent(eventId) {

    const event =
        events.find(
            function(e) {

                return String(e.id) ===
                    String(eventId);

            }
        );


    if (!event) {

        return;

    }


    const name =
        prompt(
            "Eventnaam:",
            event.name
        );


    if (name === null) {

        return;

    }


    if (
        name.trim() === ""
    ) {

        alert(
            "Eventnaam mag niet leeg zijn."
        );

        return;

    }


    const date =
        prompt(
            "Datum (YYYY-MM-DD):",
            event.date
        );


    if (date === null) {

        return;

    }


    const location =
        prompt(
            "Locatie:",
            event.location || ""
        );


    if (location === null) {

        return;

    }


    const city =
        prompt(
            "Stad / Land:",
            event.city || ""
        );


    if (city === null) {

        return;

    }


    const description =
        prompt(
            "Beschrijving:",
            event.description || ""
        );


    if (description === null) {

        return;

    }


    event.name =
        name.trim();


    event.date =
        date.trim();


    event.location =
        location.trim();


    event.city =
        city.trim();


    event.description =
        description.trim();


    saveEvents();


    displayEvents();


    showSuccess(
        "✅ Event aangepast!"
    );

}


/*
==================================================
EVENT VERWIJDEREN
==================================================
*/

function deleteEvent(eventId) {

    const event =
        events.find(
            function(e) {

                return String(e.id) ===
                    String(eventId);

            }
        );


    if (!event) {

        return;

    }


    const confirmed =
        confirm(
            "Weet je zeker dat je '" +
            event.name +
            "' wilt verwijderen?"
        );


    if (!confirmed) {

        return;

    }


    events =
        events.filter(
            function(e) {

                return String(e.id) !==
                    String(eventId);

            }
        );


    saveEvents();


    displayEvents();


    showSuccess(
        "🗑️ Event verwijderd!"
    );

}


/*
==================================================
FORMULIER WISSEN
==================================================
*/

function clearForm() {

    document.getElementById(
        "eventName"
    ).value = "";


    document.getElementById(
        "eventDate"
    ).value = "";


    document.getElementById(
        "eventLocation"
    ).value = "";


    document.getElementById(
        "eventCity"
    ).value = "";


    document.getElementById(
        "eventDescription"
    ).value = "";

}


/*
==================================================
SUCCESS
==================================================
*/

function showSuccess(message) {

    const box =
        document.getElementById(
            "success"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        3000
    );

}


/*
==================================================
ERROR
==================================================
*/

function showError(message) {

    const box =
        document.getElementById(
            "error"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


/*
==================================================
MESSAGES VERBERGEN
==================================================
*/

function hideMessages() {

    document.getElementById(
        "success"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "none";

}


/*
==================================================
HTML VEILIG MAKEN
==================================================
*/

function escapeHTML(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

function resetEvents() {

            "WAARSCHUWING!\n\n" +
            "Hiermee verwijder je ALLE events " +
            "uit deze browser.\n\n" +
            "Doorgaan?"
        );


    if (!confirmed) {

        return;

    }


    localStorage.removeItem(
        "events"
    );


    events = [];


    displayEvents();


    showSuccess(
        "Alle events zijn verwijderd."
    );

}
