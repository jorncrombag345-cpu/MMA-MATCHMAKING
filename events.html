<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Events - MMA Matchmaker</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #090909;

            color: white;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background: #111;

            border-bottom:
                2px solid #e10600;

            padding: 18px 35px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

            white-space: nowrap;

        }


        .logo span {

            color: #e10600;

        }


        nav {

            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

        }


        nav a {

            color: #aaa;

            text-decoration: none;

            margin-left: 18px;

            font-size: 14px;

            font-weight: bold;

        }


        nav a:hover {

            color: white;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 1150px;

            margin: auto;

            padding: 40px 20px 60px;

        }


        h1 {

            margin-bottom: 8px;

        }


        .subtitle {

            color: #777;

            margin-bottom: 30px;

        }


        /* =========================
           CARDS
        ========================= */

        .card {

            background: #151515;

            border:
                1px solid #292929;

            border-radius: 10px;

            padding: 25px;

            margin-bottom: 25px;

        }


        .card h2 {

            margin-bottom: 20px;

        }


        /* =========================
           FORM
        ========================= */

        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .field {

            margin-bottom: 5px;

        }


        .full {

            grid-column:
                1 / -1;

        }


        label {

            display: block;

            color: #aaa;

            margin-bottom: 8px;

            font-size: 14px;

        }


        input,
        textarea {

            width: 100%;

            padding: 14px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 7px;

            font-family: inherit;

            font-size: 15px;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        input:focus,
        textarea:focus {

            outline: none;

            border-color:
                #e10600;

        }


        /* =========================
           BUTTONS
        ========================= */

        .button {

            width: 100%;

            padding: 15px;

            background: #e10600;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

        }


        .button:hover {

            background: #ff211a;

        }


        .secondary {

            background: #222;

            border:
                1px solid #444;

            margin-top: 10px;

        }


        .secondary:hover {

            background: #333;

        }


        /* =========================
           MESSAGES
        ========================= */

        .message {

            display: none;

            padding: 14px;

            border-radius: 7px;

            margin-top: 15px;

            text-align: center;

        }


        .success {

            background: #12351f;

            border:
                1px solid #1f7540;

            color: #6ee7a0;

        }


        .error {

            background: #3a1111;

            border:
                1px solid #6d2222;

            color: #ff8b8b;

        }


        /* =========================
           EVENT LIST
        ========================= */

        .event-list {

            display: grid;

            gap: 15px;

        }


        .event-card {

            background: #101010;

            border:
                1px solid #333;

            border-radius: 10px;

            padding: 22px;

        }


        .event-header {

            display: flex;

            justify-content:
                space-between;

            align-items: flex-start;

            gap: 15px;

            margin-bottom: 15px;

        }


        .event-name {

            font-size: 23px;

            font-weight: bold;

        }


        .event-meta {

            color: #777;

            font-size: 13px;

            margin-top: 7px;

            line-height: 1.6;

        }


        .event-description {

            color: #999;

            line-height: 1.5;

            margin-bottom: 18px;

        }


        .event-actions {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        .small-button {

            padding: 9px 13px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 6px;

            cursor: pointer;

        }


        .small-button:hover {

            background: #333;

        }


        .delete-button:hover {

            background: #5a1515;

            border-color: #7a2222;

        }


        /* =========================
           STATUS
        ========================= */

        .status {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 5px;

            font-size: 11px;

            font-weight: bold;

            text-transform: uppercase;

        }


        .upcoming {

            background: #12351f;

            color: #6ee7a0;

        }


        .past {

            background: #292929;

            color: #aaa;

        }


        /* =========================
           FIGHTS
        ========================= */

        .fights {

            border-top:
                1px solid #292929;

            padding-top: 18px;

            display: none;

        }


        .fight {

            background: #151515;

            border:
                1px solid #333;

            border-radius: 8px;

            padding: 15px;

            margin-bottom: 10px;

        }


        .fight:last-child {

            margin-bottom: 0;

        }


        .fight-top {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 8px;

        }


        .fight-number {

            color: #777;

            font-size: 12px;

        }


        .badges {

            display: flex;

            gap: 6px;

            flex-wrap: wrap;

        }


        .badge {

            display: inline-block;

            padding: 4px 7px;

            border-radius: 4px;

            background: #292929;

            color: #ccc;

            font-size: 10px;

            font-weight: bold;

        }


        .title-badge {

            background: #5c4b00;

            color: #ffd700;

        }


        .main-badge {

            background: #e10600;

            color: white;

        }


        .fight-names {

            font-size: 18px;

            font-weight: bold;

        }


        .fight-names span {

            color: #e10600;

            margin: 0 7px;

        }


        .fight-info {

            color: #777;

            font-size: 12px;

            margin-top: 7px;

        }


        .result {

            color: #6ee7a0;

            margin-top: 7px;

            font-size: 13px;

        }


        .empty {

            color: #666;

            text-align: center;

            padding: 25px;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 750px) {

            header {

                flex-direction: column;

                gap: 18px;

            }


            nav {

                justify-content: center;

            }


            nav a {

                margin: 5px 7px;

            }


            .grid {

                grid-template-columns: 1fr;

            }


            .full {

                grid-column: auto;

            }


            .event-header {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->


<header>


    <div class="logo">

        MMA
        <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fighter-profile.html">
            Profiles
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>



<!-- =========================
     MAIN
========================= -->


<main class="container">


    <h1>
        📅 Events
    </h1>


    <p class="subtitle">

        Maak en beheer je eigen MMA-events.

    </p>



    <!-- =========================
         NIEUW EVENT
    ========================= -->


    <div class="card">

        <h2>
            Nieuw Event
        </h2>


        <div class="grid">


            <div class="field">

                <label>
                    Eventnaam
                </label>


                <input
                    id="eventName"
                    type="text"
                    placeholder="Bijv. MMA 300"
                >

            </div>


            <div class="field">

                <label>
                    Datum
                </label>


                <input
                    id="eventDate"
                    type="date"
                >

            </div>


            <div class="field">

                <label>
                    Locatie
                </label>


                <input
                    id="eventLocation"
                    type="text"
                    placeholder="Bijv. Amsterdam Arena"
                >

            </div>


            <div class="field">

                <label>
                    Stad / Land
                </label>


                <input
                    id="eventCity"
                    type="text"
                    placeholder="Bijv. Amsterdam, Nederland"
                >

            </div>


            <div class="field full">

                <label>
                    Beschrijving
                </label>


                <textarea
                    id="eventDescription"
                    placeholder="Beschrijving van het event..."
                ></textarea>

            </div>


            <div class="field full">


                <button
                    class="button"
                    onclick="createEvent()"
                >

                    ➕ Event maken

                </button>


                <button
                    class="button secondary"
                    onclick="clearForm()"
                >

                    Wissen

                </button>


                <div
                    id="success"
                    class="message success"
                ></div>


                <div
                    id="error"
                    class="message error"
                ></div>


            </div>


        </div>

    </div>



    <!-- =========================
         EVENTS
    ========================= -->


    <div class="card">

        <h2>
            Alle Events
        </h2>


        <div
            id="eventList"
            class="event-list"
        ></div>

    </div>


</main>



<script>


/*
==================================================
DATA
==================================================
*/


let events =
    JSON.parse(
        localStorage.getItem(
            "events"
        )
    ) || [];


let fighters =
    JSON.parse(
        localStorage.getItem(
            "fighters"
        )
    ) || [];



/*
==================================================
DATA OPSLAAN
==================================================
*/


function saveEvents() {

    localStorage.setItem(
        "events",
        JSON.stringify(events)
    );

}



/*
==================================================
FIGHTER OPZOEKEN
==================================================
*/


function getFighter(id) {

    return fighters.find(
        fighter =>
            fighter.id == id
    );

}



/*
==================================================
DATUM FORMATTEREN
==================================================
*/


function formatDate(
    date
) {

    if (!date) {

        return "Geen datum";

    }


    const d =
        new Date(
            date + "T00:00:00"
        );


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {

        return date;

    }


    return d.toLocaleDateString(
        "nl-NL",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}



/*
==================================================
EVENT STATUS
==================================================
*/


function getStatus(
    date
) {


    if (!date) {

        return {

            text: "Geen datum",

            className: "past"

        };

    }


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const eventDate =
        new Date(
            date + "T00:00:00"
        );


    if (
        eventDate >= today
    ) {

        return {

            text: "Upcoming",

            className: "upcoming"

        };

    }


    return {

        text: "Past",

        className: "past"

    };

}



/*
==================================================
EVENT MAKEN
==================================================
*/


function createEvent() {


    hideMessages();


    const name =
        document
            .getElementById(
                "eventName"
            )
            .value
            .trim();


    const date =
        document
            .getElementById(
                "eventDate"
            )
            .value;


    const location =
        document
            .getElementById(
                "eventLocation"
            )
            .value
            .trim();


    const city =
        document
            .getElementById(
                "eventCity"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "eventDescription"
            )
            .value
            .trim();


    if (!name) {

        showError(
            "Vul een eventnaam in."
        );

        return;

    }


    if (!date) {

        showError(
            "Kies een datum."
        );

        return;

    }


    const event = {

        id:
            Date.now() +
            Math.floor(
                Math.random() *
                10000
            ),

        name:
            name,

        date:
            date,

        location:
            location,

        city:
            city,

        description:
            description,

        fights:
            [],

        createdAt:
            new Date().toISOString()

    };


    events.push(
        event
    );


    saveEvents();


    clearForm();


    displayEvents();


    showSuccess(
        event.name +
        " is aangemaakt!"
    );

}



/*
==================================================
EVENTS WEERGEVEN
==================================================
*/


function displayEvents() {


    const list =
        document.getElementById(
            "eventList"
        );


    list.innerHTML = "";


    if (
        events.length === 0
    ) {

        list.innerHTML = `

            <div class="empty">

                Er zijn nog geen events.

            </div>

        `;

        return;

    }


    const sorted =
        [...events].sort(
            (a, b) => {

                if (!a.date) {

                    return 1;

                }


                if (!b.date) {

                    return -1;

                }


                return (
                    new Date(
                        a.date
                    ) -
                    new Date(
                        b.date
                    )
                );

            }
        );


    sorted.forEach(
        event => {


            const status =
                getStatus(
                    event.date
                );


            const fights =
                Array.isArray(
                    event.fights
                )
                    ? event.fights
                    : [];


            const eventId =
                event.id;


            list.innerHTML += `

                <div class="event-card">


                    <div class="event-header">


                        <div>


                            <div class="event-name">

                                ${escapeHtml(
                                    event.name
                                )}

                            </div>


                            <div class="event-meta">

                                📅
                                ${formatDate(
                                    event.date
                                )}

                                ${
                                    event.location
                                        ? " • 📍 " +
                                          escapeHtml(
                                              event.location
                                          )
                                        : ""
                                }

                                ${
                                    event.city
                                        ? " • " +
                                          escapeHtml(
                                              event.city
                                          )
                                        : ""
                                }

                                <br>

                                🥊
                                ${fights.length}
                                fight(s)

                            </div>


                        </div>


                        <span
                            class="status
                            ${status.className}"
                        >

                            ${status.text}

                        </span>


                    </div>



                    ${
                        event.description
                            ? `
                                <div
                                    class="event-description"
                                >

                                    ${escapeHtml(
                                        event.description
                                    )}

                                </div>
                              `
                            : ""
                    }



                    <div class="event-actions">


                        <button
                            class="small-button"
                            onclick="
                                toggleFights(
                                    ${eventId}
                                )
                            "
                        >

                            🥊 Bekijk Fights

                        </button>


                        <button
                            class="small-button"
                            onclick="
                                editEvent(
                                    ${eventId}
                                )
                            "
                        >

                            ✏️ Bewerken

                        </button>


                        <button
                            class="
                                small-button
                                delete-button
                            "
                            onclick="
                                deleteEvent(
                                    ${eventId}
                                )
                            "
                        >

                            🗑️ Verwijderen

                        </button>


                    </div>



                    <div
                        id="fights-${eventId}"
                        class="fights"
                    ></div>


                </div>

            `;

        }
    );

}



/*
==================================================
FIGHTS TONEN
==================================================
*/


function toggleFights(
    eventId
) {


    const box =
        document.getElementById(
            "fights-" +
            eventId
        );


    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

        return;

    }


    displayFights(
        eventId
    );


    box.style.display =
        "block";

}



/*
==================================================
FIGHTS WEERGEVEN
==================================================
*/


function displayFights(
    eventId
) {


    const box =
        document.getElementById(
            "fights-" +
            eventId
        );


    const event =
        events.find(
            e =>
                e.id ==
                eventId
        );


    if (!event) {

        return;

    }


    const fights =
        Array.isArray(
            event.fights
        )
            ? event.fights
            : [];


    box.innerHTML = "";


    if (
        fights.length === 0
    ) {

        box.innerHTML = `

            <div class="empty">

                Nog geen fights.

                <br><br>

                Gebruik de Matchmaker
                om fights toe te voegen.

            </div>

        `;

        return;

    }


    fights.forEach(
        (fight, index) => {


            const fighterA =
                getFighter(
                    fight.fighterA
                );


            const fighterB =
                getFighter(
                    fight.fighterB
                );


            const nameA =
                fighterA
                    ? fighterA.name
                    : "Fighter A";


            const nameB =
                fighterB
                    ? fighterB.name
                    : "Fighter B";


            let badges = "";


            if (
                fight.fightType ===
                "Title"
            ) {

                badges += `

                    <span
                        class="
                            badge
                            title-badge
                        "
                    >

                        🏆 TITLE

                    </span>

                `;

            }


            if (
                fight.position ===
                "Main Event"
            ) {

                badges += `

                    <span
                        class="
                            badge
                            main-badge
                        "
                    >

                        MAIN EVENT

                    </span>

                `;

            }


            else if (
                fight.position ===
                "Co-Main Event"
            ) {

                badges += `

                    <span class="badge">

                        CO-MAIN EVENT

                    </span>

                `;

            }


            let resultText = "";


            if (
                fight.result
            ) {

                let winner = "Unknown";


                if (
                    fight.result
                        .winner === "A"
                ) {

                    winner =
                        nameA +
                        " wint";

                }


                else if (
                    fight.result
                        .winner === "B"
                ) {

                    winner =
                        nameB +
                        " wint";

                }


                else if (
                    fight.result
                        .winner === "DRAW"
                ) {

                    winner =
                        "Draw";

                }


                else if (
                    fight.result
                        .winner === "NC"
                ) {

                    winner =
                        "No Contest";

                }


                resultText = `

                    <div class="result">

                        🏆
                        ${escapeHtml(
                            winner
                        )}

                        ${
                            fight.result.method
                                ? " • " +
                                  escapeHtml(
                                      fight.result.method
                                  )
                                : ""
                        }

                    </div>

                `;

            }


            box.innerHTML += `

                <div class="fight">


                    <div class="fight-top">


                        <div class="fight-number">

                            Fight #${index + 1}

                        </div>


                        <div class="badges">

                            ${badges}

                        </div>


                    </div>


                    <div class="fight-names">

                        ${escapeHtml(
                            nameA
                        )}

                        <span>
                            VS
                        </span>

                        ${escapeHtml(
                            nameB
                        )}

                    </div>


                    <div class="fight-info">

                        ${escapeHtml(
                            fight.weightClass ||
                            "Onbekend"
                        )}

                        •

                        ${fight.rounds || 3}
                        Rounds

                        ${
                            fight.titleName
                                ? " • " +
                                  escapeHtml(
                                      fight.titleName
                                  )
                                : ""
                        }

                    </div>


                    ${resultText}


                </div>

            `;

        }
    );

}



/*
==================================================
EVENT BEWERKEN
==================================================
*/


function editEvent(
    eventId
) {


    const event =
        events.find(
            e =>
                e.id ==
                eventId
        );


    if (!event) {

        return;

    }


    const newName =
        prompt(
            "Eventnaam:",
            event.name || ""
        );


    if (
        newName === null
    ) {

        return;

    }


    const newDate =
        prompt(
            "Datum (YYYY-MM-DD):",
            event.date || ""
        );


    if (
        newDate === null
    ) {

        return;

    }


    const newLocation =
        prompt(
            "Locatie:",
            event.location || ""
        );


    if (
        newLocation === null
    ) {

        return;

    }


    const newCity =
        prompt(
            "Stad / Land:",
            event.city || ""
        );


    if (
        newCity === null
    ) {

        return;

    }


    const newDescription =
        prompt(
            "Beschrijving:",
            event.description || ""
        );


    if (
        newDescription === null
    ) {

        return;

    }


    if (
        !newName.trim()
    ) {

        alert(
            "De eventnaam mag niet leeg zijn."
        );

        return;

    }


    event.name =
        newName.trim();


    event.date =
        newDate.trim();


    event.location =
        newLocation.trim();


    event.city =
        newCity.trim();


    event.description =
        newDescription.trim();


    saveEvents();


    displayEvents();

}



/*
==================================================
EVENT VERWIJDEREN
==================================================
*/


function deleteEvent(
    eventId
) {


    const event =
        events.find(
            e =>
                e.id ==
                eventId
        );


    if (!event) {

        return;

    }


    const fights =
        Array.isArray(
            event.fights
        )
            ? event.fights.length
            : 0;


    let message =
        "Weet je zeker dat je " +
        event.name +
        " wilt verwijderen?";


    if (fights > 0) {

        message +=
            "\n\nDit event heeft " +
            fights +
            " fight(s). Deze worden ook verwijderd.";

    }


    const confirmed =
        confirm(
            message
        );


    if (!confirmed) {

        return;

    }


    events =
        events.filter(
            e =>
                e.id !=
                eventId
        );


    saveEvents();


    displayEvents();


    showSuccess(
        "Event verwijderd."
    );

}



/*
==================================================
FORMULIER WISSEN
==================================================
*/


function clearForm() {


    document.getElementById(
        "eventName"
    ).value = "";


    document.getElementById(
        "eventDate"
    ).value = "";


    document.getElementById(
        "eventLocation"
    ).value = "";


    document.getElementById(
        "eventCity"
    ).value = "";


    document.getElementById(
        "eventDescription"
    ).value = "";

}



/*
==================================================
MESSAGES
==================================================
*/


function hideMessages() {


    document.getElementById(
        "success"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "none";

}



function showSuccess(
    message
) {


    const box =
        document.getElementById(
            "success"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3000
    );

}



function showError(
    message
) {


    const box =
        document.getElementById(
            "error"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}



/*
==================================================
VEILIGE TEKST
==================================================
*/


function escapeHtml(
    text
) {


    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

*/


displayEvents();
