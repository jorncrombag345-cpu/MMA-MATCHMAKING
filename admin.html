<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - MMA Matchmaker</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #0b0b0b;

            color: white;

        }


        header {

            background: #111;

            border-bottom:
                2px solid #e10600;

            padding:
                20px 40px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #e10600;

        }


        nav a {

            color: white;

            text-decoration: none;

            margin-left: 20px;

            font-weight: bold;

        }


        nav a:hover {

            color: #e10600;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding:
                40px 20px;

        }


        h1 {

            margin-bottom: 10px;

        }


        .subtitle {

            color: #888;

            margin-bottom: 30px;

        }


        .card {

            background: #151515;

            border:
                1px solid #292929;

            border-radius: 10px;

            padding: 25px;

            margin-bottom: 25px;

        }


        .card h2 {

            margin-bottom: 20px;

        }


        select,
        input {

            width: 100%;

            padding: 13px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 6px;

            font-size: 15px;

        }


        label {

            display: block;

            color: #aaa;

            margin-bottom: 8px;

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .field {

            margin-bottom: 18px;

        }


        .button {

            width: 100%;

            padding: 15px;

            background: #e10600;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

        }


        .button:hover {

            background: #ff211a;

        }


        .danger {

            background: #333;

            margin-top: 12px;

        }


        .danger:hover {

            background: #555;

        }


        .success {

            display: none;

            background: #12351f;

            border:
                1px solid #1f7540;

            color: #6ee7a0;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;

        }


        .fighter-list {

            display: grid;

            gap: 12px;

        }


        .fighter-item {

            background: #101010;

            border:
                1px solid #333;

            border-radius: 8px;

            padding: 18px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

        }


        .fighter-info strong {

            font-size: 18px;

        }


        .fighter-info small {

            display: block;

            color: #777;

            margin-top: 5px;

        }


        .edit-button {

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 6px;

            padding:
                10px 15px;

            cursor: pointer;

        }


        .edit-button:hover {

            background: #333;

        }


        .empty {

            color: #777;

            text-align: center;

            padding: 20px;

        }


        @media (max-width: 700px) {

            header {

                flex-direction: column;

                gap: 20px;

            }


            nav {

                text-align: center;

            }


            nav a {

                display: inline-block;

                margin: 5px;

            }


            .grid {

                grid-template-columns: 1fr;

            }


            .fighter-item {

                flex-direction: column;

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


<header>


    <div class="logo">

        MMA
        <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fighter-profile.html">
            Profiles
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<div class="container">


    <h1>
        ⚙️ Admin Panel
    </h1>


    <p class="subtitle">

        Beheer fighters, records en rankings.

    </p>


    <!-- FIGHTER KIEZEN -->


    <div class="card">

        <h2>
            Fighter selecteren
        </h2>


        <select
            id="fighterSelect"
            onchange="loadFighter()"
        >

            <option value="">
                Kies een fighter
            </option>

        </select>

    </div>


    <!-- EDITOR -->


    <div
        id="editor"
        class="card"
        style="display:none;"
    >

        <h2>
            Fighter bewerken
        </h2>


        <div class="grid">


            <div class="field">

                <label>
                    Naam
                </label>

                <input
                    id="name"
                    type="text"
                >

            </div>


            <div class="field">

                <label>
                    Gewichtsklasse
                </label>

                <select id="weightClass">

                    <option>
                        Flyweight
                    </option>

                    <option>
                        Bantamweight
                    </option>

                    <option>
                        Featherweight
                    </option>

                    <option>
                        Lightweight
                    </option>

                    <option>
                        Welterweight
                    </option>

                    <option>
                        Middleweight
                    </option>

                    <option>
                        Light Heavyweight
                    </option>

                    <option>
                        Heavyweight
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Wins
                </label>

                <input
                    id="wins"
                    type="number"
                    min="0"
                >

            </div>


            <div class="field">

                <label>
                    Losses
                </label>

                <input
                    id="losses"
                    type="number"
                    min="0"
                >

            </div>


            <div class="field">

                <label>
                    Draws
                </label>

                <input
                    id="draws"
                    type="number"
                    min="0"
                >

            </div>


            <div class="field">

                <label>
                    Ranking
                </label>

                <input
                    id="ranking"
                    type="number"
                    min="1"
                    placeholder="Leeg = unranked"
                >

            </div>


            <div class="field">

                <label>
                    Win streak
                </label>

                <input
                    id="streak"
                    type="number"
                    min="0"
                >

            </div>


        </div>


        <button
            class="button"
            onclick="saveFighter()"
        >

            💾 Fighter opslaan

        </button>


        <button
            class="button danger"
            onclick="deleteFighter()"
        >

            🗑️ Fighter verwijderen

        </button>


        <div
            id="success"
            class="success"
        >

            Fighter opgeslagen! 🔥

        </div>

    </div>


    <!-- OVERZICHT -->


    <div class="card">

        <h2>
            Alle fighters
        </h2>


        <div
            id="fighterList"
            class="fighter-list"
        ></div>

    </div>


</div>


<script>


/*
==================================================
DATA
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem("fighters")
    ) || [];


let selectedId = null;


/*
==================================================
OPSLAAN
==================================================
*/

function saveData() {

    localStorage.setItem(
        "fighters",
        JSON.stringify(fighters)
    );

}


/*
==================================================
DROPDOWN LADEN
==================================================
*/

function loadDropdown() {

    const select =
        document.getElementById(
            "fighterSelect"
        );


    select.innerHTML = `

        <option value="">
            Kies een fighter
        </option>

    `;


    fighters.forEach(
        fighter => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                fighter.id;


            option.textContent =
                fighter.name;


            select.appendChild(
                option
            );

        }
    );

}


/*
==================================================
FIGHTER LADEN
==================================================
*/

function loadFighter() {

    const id =
        document.getElementById(
            "fighterSelect"
        ).value;


    const editor =
        document.getElementById(
            "editor"
        );


    if (!id) {

        editor.style.display =
            "none";

        selectedId = null;

        return;

    }


    const fighter =
        fighters.find(
            fighter =>
                fighter.id == id
        );


    if (!fighter) return;


    selectedId =
        fighter.id;


    document.getElementById(
        "name"
    ).value =
        fighter.name;


    document.getElementById(
        "weightClass"
    ).value =
        fighter.weightClass;


    document.getElementById(
        "wins"
    ).value =
        fighter.wins;


    document.getElementById(
        "losses"
    ).value =
        fighter.losses;


    document.getElementById(
        "draws"
    ).value =
        fighter.draws;


    document.getElementById(
        "ranking"
    ).value =
        fighter.ranking || "";


    document.getElementById(
        "streak"
    ).value =
        fighter.streak || 0;


    editor.style.display =
        "block";

}


/*
==================================================
FIGHTER OPSLAAN
==================================================
*/

function saveFighter() {

    if (!selectedId) {

        return;

    }


    const fighter =
        fighters.find(
            fighter =>
                fighter.id ===
                selectedId
        );


    if (!fighter) return;


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    if (!name) {

        alert(
            "Vul een naam in."
        );

        return;

    }


    fighter.name =
        name;


    fighter.weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    fighter.wins =
        Number(
            document.getElementById(
                "wins"
            ).value
        ) || 0;


    fighter.losses =
        Number(
            document.getElementById(
                "losses"
            ).value
        ) || 0;


    fighter.draws =
        Number(
            document.getElementById(
                "draws"
            ).value
        ) || 0;


    const rankingValue =
        document.getElementById(
            "ranking"
        ).value;


    fighter.ranking =
        rankingValue
            ? Number(rankingValue)
            : null;


    fighter.streak =
        Number(
            document.getElementById(
                "streak"
            ).value
        ) || 0;


    saveData();


    loadDropdown();

    loadFighter();

    displayFighters();


    /*
    Dropdown selectie behouden
    */

    document.getElementById(
        "fighterSelect"
    ).value =
        selectedId;


    /*
    Success
    */

    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(
        () => {

            success.style.display =
                "none";

        },
        2500
    );

}


/*
==================================================
FIGHTER VERWIJDEREN
==================================================
*/

function deleteFighter() {

    if (!selectedId) {

        return;

    }


    const fighter =
        fighters.find(
            fighter =>
                fighter.id ===
                selectedId
        );


    if (!fighter) return;


    const confirmed =
        confirm(
            "Weet je zeker dat je " +
            fighter.name +
            " wilt verwijderen?"
        );


    if (!confirmed) {

        return;

    }


    fighters =
        fighters.filter(
            fighter =>
                fighter.id !==
                selectedId
        );


    saveData();


    selectedId = null;


    document.getElementById(
        "editor"
    ).style.display =
        "none";


    loadDropdown();

    displayFighters();

}


/*
==================================================
FIGHTERS OVERZICHT
==================================================
*/

function displayFighters() {

    const list =
        document.getElementById(
            "fighterList"
        );


    list.innerHTML = "";


    if (fighters.length === 0) {

        list.innerHTML = `

            <div class="empty">

                Geen fighters gevonden.

            </div>

        `;

        return;

    }


    fighters.forEach(
        fighter => {

            list.innerHTML += `

                <div class="fighter-item">


                    <div class="fighter-info">

                        <strong>
                            ${fighter.name}
                        </strong>


                        <small>

                            ${fighter.weightClass}

                            • Record:
                            ${fighter.wins}-${fighter.losses}-${fighter.draws}

                            • Ranking:
                            ${
                                fighter.ranking
                                    ? "#" + fighter.ranking
                                    : "Unranked"
                            }

                        </small>

                    </div>


                    <button
                        class="edit-button"
                        onclick="
                            selectFighter(
                                ${fighter.id}
                            )
                        "
                    >

                        ✏️ Bewerken

                    </button>


                </div>

            `;

        }
    );

}


/*
==================================================
FIGHTER SELECTEREN UIT LIJST
==================================================
*/

function selectFighter(id) {

    document.getElementById(
        "fighterSelect"
    ).value =
        id;


    loadFighter();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/*
==================================================
START
==================================================
*/

loadDropdown();

displayFighters();


</script>


</body>

</html>
