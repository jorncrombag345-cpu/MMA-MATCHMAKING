<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin - MMA Matchmaker</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #0b0b0b;

            color: white;

        }


        header {

            background: #111;

            border-bottom:
                2px solid #e10600;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #e10600;

        }


        nav {

            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

        }


        nav a {

            color: white;

            text-decoration: none;

            margin-left: 20px;

            font-weight: bold;

        }


        nav a:hover {

            color: #e10600;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 40px 20px;

        }


        h1 {

            margin-bottom: 10px;

        }


        .subtitle {

            color: #888;

            margin-bottom: 30px;

        }


        .card {

            background: #151515;

            border:
                1px solid #292929;

            border-radius: 10px;

            padding: 25px;

            margin-bottom: 25px;

        }


        .card h2 {

            margin-bottom: 20px;

        }


        select,
        input {

            width: 100%;

            padding: 13px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 6px;

            font-size: 15px;

        }


        label {

            display: block;

            color: #aaa;

            margin-bottom: 8px;

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .field {

            margin-bottom: 18px;

        }


        .button {

            width: 100%;

            padding: 15px;

            background: #e10600;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

        }


        .button:hover {

            background: #ff211a;

        }


        .delete-button {

            margin-top: 12px;

            background: #333;

        }


        .delete-button:hover {

            background: #555;

        }


        .success {

            display: none;

            background: #12351f;

            border:
                1px solid #1f7540;

            color: #6ee7a0;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;

        }


        .fighter-list {

            display: grid;

            gap: 12px;

        }


        .fighter-item {

            background: #101010;

            border:
                1px solid #333;

            border-radius: 8px;

            padding: 18px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .fighter-info strong {

            font-size: 18px;

        }


        .fighter-info small {

            display: block;

            color: #777;

            margin-top: 5px;

        }


        .edit-button {

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 6px;

            padding: 10px 15px;

            cursor: pointer;

        }


        .edit-button:hover {

            background: #333;

        }


        .champion-label {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .champion-label select {

            max-width: 250px;

        }


        .rank-preview {

            background: #101010;

            border:
                1px solid #333;

            border-radius: 8px;

            padding: 20px;

            margin-top: 20px;

        }


        .rank-preview-title {

            color: #ffd700;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .empty {

            color: #777;

            text-align: center;

            padding: 20px;

        }


        @media (max-width: 700px) {

            header {

                flex-direction: column;

                gap: 20px;

            }


            nav {

                justify-content: center;

            }


            nav a {

                display: inline-block;

                margin: 5px;

            }


            .grid {

                grid-template-columns: 1fr;

            }


            .fighter-item {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


<header>


    <div class="logo">

        MMA
        <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fighter-profile.html">
            Profiles
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<div class="container">


    <h1>
        ⚙️ Admin Panel
    </h1>


    <p class="subtitle">

        Beheer fighters, records, rankings en champions.

    </p>


    <!-- FIGHTER SELECTEREN -->


    <div class="card">

        <h2>
            Fighter selecteren
        </h2>


        <select
            id="fighterSelect"
            onchange="loadFighter()"
        >

            <option value="">
                Kies een fighter
            </option>

        </select>

    </div>


    <!-- FIGHTER BEWERKEN -->


    <div
        id="editor"
        class="card"
        style="display:none;"
    >

        <h2>
            Fighter bewerken
        </h2>


        <div class="grid">


            <!-- NAAM -->


            <div class="field">

                <label>
                    Naam
                </label>

                <input
                    id="name"
                    type="text"
                >

            </div>


            <!-- GEWICHTSKLASSE -->


            <div class="field">

                <label>
                    Gewichtsklasse
                </label>

                <select id="weightClass">

                    <option value="Flyweight">
                        Flyweight
                    </option>

                    <option value="Bantamweight">
                        Bantamweight
                    </option>

                    <option value="Featherweight">
                        Featherweight
                    </option>

                    <option value="Lightweight">
                        Lightweight
                    </option>

                    <option value="Welterweight">
                        Welterweight
                    </option>

                    <option value="Middleweight">
                        Middleweight
                    </option>

                    <option value="Light Heavyweight">
                        Light Heavyweight
                    </option>

                    <option value="Heavyweight">
                        Heavyweight
                    </option>

                </select>

            </div>


            <!-- WINS -->


            <div class="field">

                <label>
                    Wins
                </label>

                <input
                    id="wins"
                    type="number"
                    min="0"
                >

            </div>


            <!-- LOSSES -->


            <div class="field">

                <label>
                    Losses
                </label>

                <input
                    id="losses"
                    type="number"
                    min="0"
                >

            </div>


            <!-- DRAWS -->


            <div class="field">

                <label>
                    Draws
                </label>

                <input
                    id="draws"
                    type="number"
                    min="0"
                >

            </div>


            <!-- RANKING -->


            <div class="field">

                <label>
                    Ranking
                </label>

                <input
                    id="ranking"
                    type="number"
                    min="1"
                    max="15"
                    placeholder="Leeg = unranked"
                >

            </div>


            <!-- STREAK -->


            <div class="field">

                <label>
                    Win streak
                </label>

                <input
                    id="streak"
                    type="number"
                    min="0"
                >

            </div>


            <!-- CHAMPION -->


            <div class="field">

                <label>
                    Champion
                </label>


                <select id="champion">

                    <option value="false">
                        Nee
                    </option>

                    <option value="true">
                        🏆 Ja
                    </option>

                </select>

            </div>


        </div>


        <!-- OPSLAAN -->


        <button
            class="button"
            onclick="saveFighter()"
        >

            💾 Fighter opslaan

        </button>


        <!-- VERWIJDEREN -->


        <button
            class="button delete-button"
            onclick="deleteFighter()"
        >

            🗑️ Fighter verwijderen

        </button>


        <!-- SUCCES -->


        <div
            id="success"
            class="success"
        >

            Fighter succesvol opgeslagen! 🔥

        </div>


        <!-- RANKING PREVIEW -->


        <div class="rank-preview">

            <div class="rank-preview-title">

                🏆 Ranking preview

            </div>


            <div id="rankPreview">

                Kies een fighter.

            </div>

        </div>

    </div>


    <!-- ALLE FIGHTERS -->


    <div class="card">

        <h2>
            Alle fighters
        </h2>


        <div
            id="fighterList"
            class="fighter-list"
        ></div>

    </div>


</div>


<script>


/*
==================================================
DATA
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem("fighters")
    ) || [];


let selectedId = null;


/*
==================================================
DATA OPSLAAN
==================================================
*/

function saveData() {

    localStorage.setItem(
        "fighters",
        JSON.stringify(fighters)
    );

}


/*
==================================================
DROPDOWN
==================================================
*/

function loadDropdown() {

    const select =
        document.getElementById(
            "fighterSelect"
        );


    select.innerHTML = `

        <option value="">
            Kies een fighter
        </option>

    `;


    fighters.forEach(
        fighter => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                fighter.id;


            option.textContent =
                fighter.name;


            select.appendChild(
                option
            );

        }
    );

}


/*
==================================================
FIGHTER LADEN
==================================================
*/

function loadFighter() {

    const id =
        document.getElementById(
            "fighterSelect"
        ).value;


    const editor =
        document.getElementById(
            "editor"
        );


    if (!id) {

        editor.style.display =
            "none";

        selectedId = null;

        return;

    }


    const fighter =
        fighters.find(
            fighter =>
                fighter.id == id
        );


    if (!fighter) {

        return;

    }


    selectedId =
        fighter.id;


    document.getElementById(
        "name"
    ).value =
        fighter.name || "";


    document.getElementById(
        "weightClass"
    ).value =
        fighter.weightClass ||
        "Lightweight";


    document.getElementById(
        "wins"
    ).value =
        fighter.wins || 0;


    document.getElementById(
        "losses"
    ).value =
        fighter.losses || 0;


    document.getElementById(
        "draws"
    ).value =
        fighter.draws || 0;


    document.getElementById(
        "ranking"
    ).value =
        fighter.ranking || "";


    document.getElementById(
        "streak"
    ).value =
        fighter.streak || 0;


    document.getElementById(
        "champion"
    ).value =
        fighter.champion === true
            ? "true"
            : "false";


    editor.style.display =
        "block";


    updateRankPreview();

}


/*
==================================================
RANKING PREVIEW
==================================================
*/

function updateRankPreview() {

    const ranking =
        document.getElementById(
            "ranking"
        ).value;


    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const champion =
        document.getElementById(
            "champion"
        ).value;


    const preview =
        document.getElementById(
            "rankPreview"
        );


    if (champion === "true") {

        preview.innerHTML = `

            🏆 Deze fighter wordt de

            <strong>
                ${weightClass} Champion
            </strong>.

        `;

        return;

    }


    if (!ranking) {

        preview.innerHTML = `

            Deze fighter is

            <strong>
                Unranked
            </strong>

            in ${weightClass}.

        `;

        return;

    }


    preview.innerHTML = `

        Deze fighter staat op

        <strong>
            #${ranking}
        </strong>

        in ${weightClass}.

    `;

}


/*
==================================================
EVENT LISTENERS
==================================================
*/

document
    .getElementById("ranking")
    .addEventListener(
        "input",
        updateRankPreview
    );


document
    .getElementById("weightClass")
    .addEventListener(
        "change",
        updateRankPreview
    );


document
    .getElementById("champion")
    .addEventListener(
        "change",
        updateRankPreview
    );


/*
==================================================
FIGHTER OPSLAAN
==================================================
*/

function saveFighter() {

    if (!selectedId) {

        return;

    }


    const fighter =
        fighters.find(
            fighter =>
                fighter.id ===
                selectedId
        );


    if (!fighter) {

        return;

    }


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    if (!name) {

        alert(
            "Vul een naam in."
        );

        return;

    }


    const rankingValue =
        document
            .getElementById("ranking")
            .value;


    const championValue =
        document
            .getElementById("champion")
            .value;


    /*
    ------------------------------------------
    GEGEVENS
    ------------------------------------------
    */

    fighter.name =
        name;


    fighter.weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    fighter.wins =
        Number(
            document.getElementById(
                "wins"
            ).value
        ) || 0;


    fighter.losses =
        Number(
            document.getElementById(
                "losses"
            ).value
        ) || 0;


    fighter.draws =
        Number(
            document.getElementById(
                "draws"
            ).value
        ) || 0;


    fighter.ranking =
        rankingValue
            ? Number(rankingValue)
            : null;


    fighter.streak =
        Number(
            document.getElementById(
                "streak"
            ).value
        ) || 0;


    fighter.champion =
        championValue === "true";


    /*
    ------------------------------------------
    CHAMPION REGEL
    ------------------------------------------

    Er kan maar één champion
    per gewichtsklasse zijn.
    */

    if (fighter.champion) {

        fighters.forEach(
            other => {

                if (
                    other.id !==
                    fighter.id
                    &&
                    other.weightClass ===
                    fighter.weightClass
                ) {

                    other.champion =
                        false;

                }

            }
        );

    }


    /*
    ------------------------------------------
    DATA OPSLAAN
    ------------------------------------------
    */

    saveData();


    /*
    ------------------------------------------
    PAGINA VERVERSEN
    ------------------------------------------
    */

    loadDropdown();

    displayFighters();


    document.getElementById(
        "fighterSelect"
    ).value =
        selectedId;


    /*
    ------------------------------------------
    SUCCESS
    ------------------------------------------
    */

    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(
        () => {

            success.style.display =
                "none";

        },
        2500
    );


    updateRankPreview();

}


/*
==================================================
FIGHTER VERWIJDEREN
==================================================
*/

function deleteFighter() {

    if (!selectedId) {

        return;

    }


    const fighter =
        fighters.find(
            fighter =>
                fighter.id ===
                selectedId
        );


    if (!fighter) {

        return;

    }


    const confirmed =
        confirm(

            "Weet je zeker dat je " +
            fighter.name +
            " wilt verwijderen?"

        );


    if (!confirmed) {

        return;

    }


    fighters =
        fighters.filter(
            fighter =>
                fighter.id !==
                selectedId
        );


    saveData();


    selectedId = null;


    document.getElementById(
        "editor"
    ).style.display =
        "none";


    loadDropdown();

    displayFighters();

}


/*
==================================================
FIGHTERS WEERGEVEN
==================================================
*/

function displayFighters() {

    const list =
        document.getElementById(
            "fighterList"
        );


    list.innerHTML = "";


    if (fighters.length === 0) {

        list.innerHTML = `

            <div class="empty">

                Geen fighters gevonden.

            </div>

        `;

        return;

    }


    fighters.forEach(
        fighter => {


            let rankingText =
                "Unranked";


            if (
                fighter.ranking
            ) {

                rankingText =
                    "#" +
                    fighter.ranking;

            }


            let championText =
                "";


            if (
                fighter.champion
            ) {

                championText =
                    " 🏆 Champion";

            }


            list.innerHTML += `

                <div class="fighter-item">


                    <div class="fighter-info">

                        <strong>

                            ${fighter.name}

                            ${championText}

                        </strong>


                        <small>

                            ${fighter.weightClass}

                            •

                            Record:
                            ${fighter.wins}-${fighter.losses}-${fighter.draws}

                            •

                            Ranking:
                            ${rankingText}

                            •

                            Streak:
                            ${fighter.streak || 0}

                        </small>

                    </div>


                    <button
                        class="edit-button"
                        onclick="
                            selectFighter(
                                ${fighter.id}
                            )
                        "
                    >

                        ✏️ Bewerken

                    </button>


                </div>

            `;

        }
    );

}


/*
==================================================
FIGHTER SELECTEREN
==================================================
*/

function selectFighter(id) {

    document.getElementById(
        "fighterSelect"
    ).value =
        id;


    loadFighter();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/*
==================================================
START
==================================================
*/

loadDropdown();

displayFighters();

</script>


</body>

</html>
