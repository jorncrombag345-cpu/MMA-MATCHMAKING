<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fight Result - MMA Matchmaker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #111;
            border-bottom: 2px solid #e10600;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #e10600;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e10600;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        select,
        input {
            width: 100%;
            padding: 13px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 6px;

            font-size: 15px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #e10600;
        }

        .fight-preview {
            margin-top: 25px;
            padding: 30px;

            background: #101010;
            border: 1px solid #333;
            border-radius: 10px;

            text-align: center;
        }

        .fighters {
            display: grid;
            grid-template-columns: 1fr 100px 1fr;

            align-items: center;
            gap: 20px;
        }

        .fighter {
            font-size: 25px;
            font-weight: bold;
        }

        .vs {
            color: #e10600;
            font-size: 25px;
            font-weight: bold;
        }

        .fight-info {
            color: #888;
            margin-top: 15px;
        }

        .winner-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;

            gap: 15px;
        }

        .field label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }

        .button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            background: #e10600;
            color: white;

            border: none;
            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;
        }

        .button:hover {
            background: #ff211a;
        }

        .result {
            background: #101010;

            border: 1px solid #333;

            border-radius: 8px;

            padding: 20px;

            margin-top: 15px;
        }

        .result h3 {
            margin-bottom: 10px;
        }

        .method {
            color: #e10600;
            font-weight: bold;
        }

        .empty {
            background: #151515;

            border-radius: 10px;

            padding: 25px;

            color: #777;

            text-align: center;
        }

        .success {
            display: none;

            background: #12351f;

            border: 1px solid #1f7540;

            color: #6ee7a0;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;
        }

        .error {
            display: none;

            background: #3a1111;

            border: 1px solid #722020;

            color: #ff8b8b;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;
        }

        .record-preview {
            margin-top: 20px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .record-box {
            background: #101010;

            border: 1px solid #333;

            border-radius: 8px;

            padding: 18px;

            text-align: center;
        }

        .record-box h3 {
            margin-bottom: 12px;
        }

        .record-number {
            font-size: 24px;
            font-weight: bold;
        }

        .record-label {
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .stat-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 15px;
        }

        .stat {
            background: #191919;

            border-radius: 6px;

            padding: 12px;

            text-align: center;
        }

        .stat strong {
            display: block;

            font-size: 20px;
        }

        .stat span {
            color: #777;

            font-size: 11px;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .fighters {
                grid-template-columns: 1fr;
            }

            .vs {
                margin: -10px 0;
            }

            .winner-grid {
                grid-template-columns: 1fr;
            }

            .record-preview {
                grid-template-columns: 1fr;
            }

            .stat-grid {
                grid-template-columns: 1fr 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        MMA <span>MATCHMAKER</span>
    </div>

    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fight-result.html">
            Results
        </a>

    </nav>

</header>


<div class="container">

    <h1>
        📝 Fight Result
    </h1>

    <p class="subtitle">
        Bepaal de officiële uitslag van een gevecht.
    </p>


    <!-- FIGHT KIEZEN -->

    <div class="card">

        <h2>
            1. Kies een fight
        </h2>

        <select
            id="fightSelect"
            onchange="showFight()"
        >

            <option value="">
                Kies een fight
            </option>

        </select>


        <div
            id="fightPreview"
            class="fight-preview"
            style="display:none;"
        >

            <div class="fighters">

                <div
                    id="fighterAName"
                    class="fighter"
                >
                    Fighter A
                </div>

                <div class="vs">
                    VS
                </div>

                <div
                    id="fighterBName"
                    class="fighter"
                >
                    Fighter B
                </div>

            </div>


            <div
                id="fightInfo"
                class="fight-info"
            ></div>

        </div>

    </div>


    <!-- RESULTAAT -->

    <div
        id="resultForm"
        class="card"
        style="display:none;"
    >

        <h2>
            2. Uitslag bepalen
        </h2>


        <div class="winner-grid">


            <div class="field">

                <label>
                    Winnaar
                </label>

                <select id="winner">

                    <option value="">
                        Kies winnaar
                    </option>

                    <option value="A">
                        Fighter A
                    </option>

                    <option value="B">
                        Fighter B
                    </option>

                    <option value="DRAW">
                        Draw
                    </option>

                    <option value="NC">
                        No Contest
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Methode
                </label>

                <select id="method">

                    <option value="">
                        Kies methode
                    </option>

                    <option value="KO">
                        KO
                    </option>

                    <option value="TKO">
                        TKO
                    </option>

                    <option value="Submission">
                        Submission
                    </option>

                    <option value="Unanimous Decision">
                        Unanimous Decision
                    </option>

                    <option value="Split Decision">
                        Split Decision
                    </option>

                    <option value="Majority Decision">
                        Majority Decision
                    </option>

                    <option value="Technical Decision">
                        Technical Decision
                    </option>

                    <option value="Disqualification">
                        Disqualification
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Ronde
                </label>

                <select id="round">

                    <option value="1">
                        Ronde 1
                    </option>

                    <option value="2">
                        Ronde 2
                    </option>

                    <option value="3">
                        Ronde 3
                    </option>

                    <option value="4">
                        Ronde 4
                    </option>

                    <option value="5">
                        Ronde 5
                    </option>

                </select>

            </div>


            <div class="field">

                <label>
                    Tijd
                </label>

                <input
                    id="time"
                    type="text"
                    placeholder="bijv. 3:42"
                >

            </div>


        </div>


        <div
            id="recordPreview"
            class="record-preview"
            style="display:none;"
        ></div>


        <button
            class="button"
            onclick="saveResult()"
        >

            🏆 Uitslag opslaan

        </button>


        <div
            id="success"
            class="success"
        ></div>


        <div
            id="error"
            class="error"
        ></div>

    </div>


    <!-- RESULTATEN -->

    <div class="card">

        <h2>
            Opgeslagen resultaten
        </h2>

        <div id="resultsList"></div>

    </div>


</div>


<script>

/*
==================================================
DATA
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem("fighters")
    ) || [];


let events =
    JSON.parse(
        localStorage.getItem("events")
    ) || [];


let selectedFight = null;


/*
==================================================
DATA OPNIEUW INLADEN
==================================================
*/

function reloadData() {

    fighters =
        JSON.parse(
            localStorage.getItem("fighters")
        ) || [];

    events =
        JSON.parse(
            localStorage.getItem("events")
        ) || [];

}


/*
==================================================
OPSLAAN
==================================================
*/

function saveEvents() {

    localStorage.setItem(
        "events",
        JSON.stringify(events)
    );

}


function saveFighters() {

    localStorage.setItem(
        "fighters",
        JSON.stringify(fighters)
    );

}


/*
==================================================
FIGHTER OPHALEN
==================================================
*/

function getFighter(id) {

    return fighters.find(
        fighter =>
            String(fighter.id) ===
            String(id)
    );

}


/*
==================================================
RECORD STRUCTUUR
==================================================
*/

function ensureRecord(fighter) {

    if (!fighter.record) {

        fighter.record = {};

    }


    fighter.record.wins =
        Number(
            fighter.record.wins || 0
        );


    fighter.record.losses =
        Number(
            fighter.record.losses || 0
        );


    fighter.record.draws =
        Number(
            fighter.record.draws || 0
        );


    fighter.record.noContests =
        Number(
            fighter.record.noContests || 0
        );


    fighter.record.ko =
        Number(
            fighter.record.ko ||
            fighter.record.KO ||
            0
        );


    fighter.record.tko =
        Number(
            fighter.record.tko ||
            fighter.record.TKO ||
            0
        );


    fighter.record.submissions =
        Number(
            fighter.record.submissions ||
            0
        );


    fighter.record.decisions =
        Number(
            fighter.record.decisions ||
            0
        );


    fighter.record.disqualifications =
        Number(
            fighter.record.disqualifications ||
            0
        );

}


/*
==================================================
RANKING STRUCTUUR
==================================================
*/

function ensureRanking(fighter) {

    if (
        fighter.ranking === undefined ||
        fighter.ranking === null ||
        fighter.ranking === ""
    ) {

        fighter.ranking = 1000;

    }


    fighter.ranking =
        Number(
            fighter.ranking
        );

}


/*
==================================================
FIGHT LABEL
==================================================
*/

function getFightLabel(
    event,
    fight
) {

    const fighterA =
        getFighter(
            fight.fighterA
        );


    const fighterB =
        getFighter(
            fight.fighterB
        );


    const nameA =
        fighterA
            ? fighterA.name
            : "Onbekend";


    const nameB =
        fighterB
            ? fighterB.name
            : "Onbekend";


    return (
        event.name +
        " — " +
        nameA +
        " vs " +
        nameB
    );

}


/*
==================================================
FIGHTS LADEN
==================================================
*/

function loadFights() {

    reloadData();


    const select =
        document.getElementById(
            "fightSelect"
        );


    select.innerHTML = `

        <option value="">
            Kies een fight
        </option>

    `;


    events.forEach(
        event => {

            if (
                !Array.isArray(
                    event.fights
                )
            ) {

                return;

            }


            event.fights.forEach(
                fight => {

                    /*
                    Alleen fights zonder
                    resultaat.
                    */

                    if (fight.result) {

                        return;

                    }


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        event.id +
                        "|" +
                        fight.id;


                    option.textContent =
                        getFightLabel(
                            event,
                            fight
                        );


                    select.appendChild(
                        option
                    );

                }
            );

        }
    );


    if (
        select.options.length === 1
    ) {

        select.innerHTML = `

            <option value="">
                Geen openstaande fights
            </option>

        `;

    }

}


/*
==================================================
FIGHT TONEN
==================================================
*/

function showFight() {

    hideMessages();


    const value =
        document.getElementById(
            "fightSelect"
        ).value;


    const preview =
        document.getElementById(
            "fightPreview"
        );


    const form =
        document.getElementById(
            "resultForm"
        );


    const recordPreview =
        document.getElementById(
            "recordPreview"
        );


    if (!value) {

        preview.style.display =
            "none";

        form.style.display =
            "none";

        recordPreview.style.display =
            "none";

        selectedFight = null;

        return;

    }


    const parts =
        value.split("|");


    const eventId =
        parts[0];


    const fightId =
        parts[1];


    const event =
        events.find(
            event =>
                String(event.id) ===
                String(eventId)
        );


    if (!event) {

        showError(
            "Event niet gevonden."
        );

        return;

    }


    const fight =
        event.fights.find(
            fight =>
                String(fight.id) ===
                String(fightId)
        );


    if (!fight) {

        showError(
            "Fight niet gevonden."
        );

        return;

    }


    selectedFight = {

        eventId:
            eventId,

        fightId:
            fightId

    };


    const fighterA =
        getFighter(
            fight.fighterA
        );


    const fighterB =
        getFighter(
            fight.fighterB
        );


    if (!fighterA || !fighterB) {

        showError(
            "Een of beide fighters konden niet worden gevonden."
        );

        return;

    }


    document.getElementById(
        "fighterAName"
    ).textContent =
        fighterA.name;


    document.getElementById(
        "fighterBName"
    ).textContent =
        fighterB.name;


    document.getElementById(
        "fightInfo"
    ).textContent =

        event.name +
        " • " +
        (
            fight.weightClass ||
            "Gewichtsklasse onbekend"
        ) +
        " • " +
        (
            fight.rounds ||
            3
        ) +
        " rondes";


    /*
    RONDE OPTIES
    */

    const round =
        document.getElementById(
            "round"
        );


    round.innerHTML = "";


    const totalRounds =
        Number(
            fight.rounds || 3
        );


    for (
        let i = 1;
        i <= totalRounds;
        i++
    ) {

        round.innerHTML += `

            <option value="${i}">
                Ronde ${i}
            </option>

        `;

    }


    /*
    WINNAAR NAMEN
    */

    document.getElementById(
        "winner"
    ).innerHTML = `

        <option value="">
            Kies winnaar
        </option>

        <option value="A">
            ${escapeHtml(fighterA.name)}
        </option>

        <option value="B">
            ${escapeHtml(fighterB.name)}
        </option>

        <option value="DRAW">
            Draw
        </option>

        <option value="NC">
            No Contest
        </option>

    `;


    preview.style.display =
        "block";


    form.style.display =
        "block";


    updateRecordPreview();

}


/*
==================================================
RECORD PREVIEW
==================================================
*/

function updateRecordPreview() {

    if (!selectedFight) {

        return;

    }


    const event =
        events.find(
            event =>
                String(event.id) ===
                String(selectedFight.eventId)
        );


    if (!event) return;


    const fight =
        event.fights.find(
            fight =>
                String(fight.id) ===
                String(selectedFight.fightId)
        );


    if (!fight) return;


    const fighterA =
        getFighter(
            fight.fighterA
        );


    const fighterB =
        getFighter(
            fight.fighterB
        );


    if (!fighterA || !fighterB) {

        return;

    }


    ensureRecord(
        fighterA
    );


    ensureRecord(
        fighterB
    );


    const box =
        document.getElementById(
            "recordPreview"
        );


    box.innerHTML = `

        <div class="record-box">

            <h3>
                ${escapeHtml(fighterA.name)}
            </h3>

            ${recordHTML(fighterA)}

        </div>


        <div class="record-box">

            <h3>
                ${escapeHtml(fighterB.name)}
            </h3>

            ${recordHTML(fighterB)}

        </div>

    `;


    box.style.display =
        "grid";

}


function recordHTML(fighter) {

    const r =
        fighter.record;


    return `

        <div class="stat-grid">

            <div class="stat">

                <strong>
                    ${r.wins}
                </strong>

                <span>
                    WINS
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${r.losses}
                </strong>

                <span>
                    LOSSES
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${r.draws}
                </strong>

                <span>
                    DRAWS
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${r.noContests}
                </strong>

                <span>
                    NC
                </span>

            </div>

        </div>

    `;

}


/*
==================================================
RESULTAAT OPSLAAN
==================================================
*/

function saveResult() {

    hideMessages();


    reloadData();


    if (!selectedFight) {

        showError(
            "Kies eerst een fight."
        );

        return;

    }


    const winner =
        document.getElementById(
            "winner"
        ).value;


    const method =
        document.getElementById(
            "method"
        ).value;


    const round =
        document.getElementById(
            "round"
        ).value;


    const time =
        document.getElementById(
            "time"
        ).value.trim();


    if (!winner) {

        showError(
            "Kies een winnaar, draw of no contest."
        );

        return;

    }


    if (!method) {

        showError(
            "Kies een methode."
        );

        return;

    }


    if (!time) {

        showError(
            "Vul de tijd in."
        );

        return;

    }


    const event =
        events.find(
            event =>
                String(event.id) ===
                String(selectedFight.eventId)
        );


    if (!event) {

        showError(
            "Event niet gevonden."
        );

        return;

    }


    const fight =
        event.fights.find(
            fight =>
                String(fight.id) ===
                String(selectedFight.fightId)
        );


    if (!fight) {

        showError(
            "Fight niet gevonden."
        );

        return;

    }


    /*
    AL RESULTAAT?
    */

    if (fight.result) {

        showError(
            "Deze fight heeft al een resultaat."
        );

        return;

    }


    const fighterA =
        getFighter(
            fight.fighterA
        );


    const fighterB =
        getFighter(
            fight.fighterB
        );


    if (!fighterA || !fighterB) {

        showError(
            "Een of beide fighters bestaan niet meer."
        );

        return;

    }


    /*
    RECORDS GARANDEREN
    */

    ensureRecord(
        fighterA
    );


    ensureRecord(
        fighterB
    );


    /*
    RANKINGS GARANDEREN
    */

    ensureRanking(
        fighterA
    );


    ensureRanking(
        fighterB
    );


    /*
    RESULTAAT OBJECT
    */

    fight.result = {

        winner:
            winner,

        method:
            method,

        round:
            Number(round),

        time:
            time,

        date:
            new Date().toISOString(),

        recordsUpdated:
            true,

        rankingsUpdated:
            true

    };


    /*
    RECORD BIJWERKEN
    */

    updateRecords(
        fighterA,
        fighterB,
        winner,
        method
    );


    /*
    RANKING BIJWERKEN
    */

    updateRankings(
        fighterA,
        fighterB,
        winner
    );


    /*
    FIGHTER DATA OPSLAAN
    */

    saveFighters();


    /*
    EVENT DATA OPSLAAN
    */

    saveEvents();


    /*
    FORMULIER RESETTEN
    */

    document.getElementById(
        "winner"
    ).value = "";


    document.getElementById(
        "method"
    ).value = "";


    document.getElementById(
        "time"
    ).value = "";


    document.getElementById(
        "fightPreview"
    ).style.display =
        "none";


    document.getElementById(
        "resultForm"
    ).style.display =
        "none";


    document.getElementById(
        "recordPreview"
    ).style.display =
        "none";


    selectedFight = null;


    /*
    LIJST VERNIEUWEN
    */

    loadFights();

    displayResults();


    /*
    SUCCES
    */

    showSuccess(
        "Uitslag opgeslagen! Record en ranking zijn bijgewerkt. 🔥"
    );

}


/*
==================================================
RECORDS BIJWERKEN
==================================================
*/

function updateRecords(
    fighterA,
    fighterB,
    winner,
    method
) {

    ensureRecord(
        fighterA
    );


    ensureRecord(
        fighterB
    );


    /*
    DRAW
    */

    if (
        winner === "DRAW"
    ) {

        fighterA.record.draws++;

        fighterB.record.draws++;

        return;

    }


    /*
    NO CONTEST
    */

    if (
        winner === "NC"
    ) {

        fighterA.record.noContests++;

        fighterB.record.noContests++;

        return;

    }


    /*
    A WINT
    */

    if (
        winner === "A"
    ) {

        fighterA.record.wins++;

        fighterB.record.losses++;


        updateFinishStats(
            fighterA,
            method
        );


        return;

    }


    /*
    B WINT
    */

    if (
        winner === "B"
    ) {

        fighterB.record.wins++;

        fighterA.record.losses++;


        updateFinishStats(
            fighterB,
            method
        );

    }

}


/*
==================================================
FINISH STATS
==================================================
*/

function updateFinishStats(
    fighter,
    method
) {

    ensureRecord(
        fighter
    );


    if (
        method === "KO"
    ) {

        fighter.record.ko++;

    }


    else if (
        method === "TKO"
    ) {

        fighter.record.tko++;

    }


    else if (
        method === "Submission"
    ) {

        fighter.record.submissions++;

    }


    else if (
        method === "Unanimous Decision" ||
        method === "Split Decision" ||
        method === "Majority Decision" ||
        method === "Technical Decision"
    ) {

        fighter.record.decisions++;

    }


    else if (
        method === "Disqualification"
    ) {

        fighter.record.disqualifications++;

    }

}


/*
==================================================
RANKING SYSTEEM
==================================================

Basis:

Winner krijgt punten.
Verliezer verliest punten.

Grote underdog-overwinning =
meer punten.

Grote favoriet-overwinning =
minder punten.

Draw =
kleine stijging.

NC =
geen verandering.
==================================================
*/

function updateRankings(
    fighterA,
    fighterB,
    winner
) {

    ensureRanking(
        fighterA
    );


    ensureRanking(
        fighterB
    );


    /*
    DRAW
    */

    if (
        winner === "DRAW"
    ) {

        fighterA.ranking += 5;

        fighterB.ranking += 5;

        normalizeRanking(
            fighterA
        );

        normalizeRanking(
            fighterB
        );

        return;

    }


    /*
    NO CONTEST
    */

    if (
        winner === "NC"
    ) {

        return;

    }


    /*
    A WINT
    */

    if (
        winner === "A"
    ) {

        const points =
            calculateRankingPoints(
                fighterA,
                fighterB
            );


        fighterA.ranking +=
            points;


        fighterB.ranking -=
            points;

    }


    /*
    B WINT
    */

    if (
        winner === "B"
    ) {

        const points =
            calculateRankingPoints(
                fighterB,
                fighterA
            );


        fighterB.ranking +=
            points;


        fighterA.ranking -=
            points;

    }


    normalizeRanking(
        fighterA
    );


    normalizeRanking(
        fighterB
    );

}


/*
==================================================
RANKING PUNTEN
==================================================
*/

function calculateRankingPoints(
    winner,
    loser
) {

    const difference =
        loser.ranking -
        winner.ranking;


    /*
    Winner is grote underdog.
    */

    if (
        difference >= 200
    ) {

        return 35;

    }


    /*
    Underdog.
    */

    if (
        difference >= 100
    ) {

        return 30;

    }


    /*
    Licht underdog.
    */

    if (
        difference >= 50
    ) {

        return 25;

    }


    /*
    Gelijke ranking.
    */

    if (
        difference >= -50
    ) {

        return 20;

    }


    /*
    Favoriet.
    */

    if (
        difference >= -100
    ) {

        return 15;

    }


    /*
    Grote favoriet.
    */

    return 10;

}


/*
==================================================
RANKING NORMALISEREN
==================================================
*/

function normalizeRanking(
    fighter
) {

    fighter.ranking =
        Math.max(
            0,
            Math.round(
                fighter.ranking
            )
        );

}


/*
==================================================
RESULTAAT TEKST
==================================================
*/

function getResultText(
    event,
    fight
) {

    const fighterA =
        getFighter(
            fight.fighterA
        );


    const fighterB =
        getFighter(
            fight.fighterB
        );


    const result =
        fight.result;


    if (!fighterA || !fighterB) {

        return "";

    }


    let winnerText = "";


    if (
        result.winner === "A"
    ) {

        winnerText =
            fighterA.name +
            " wint";

    }

    else if (
        result.winner === "B"
    ) {

        winnerText =
            fighterB.name +
            " wint";

    }

    else if (
        result.winner === "DRAW"
    ) {

        winnerText =
            "Draw";

    }

    else if (
        result.winner === "NC"
    ) {

        winnerText =
            "No Contest";

    }


    return `

        <h3>

            ${escapeHtml(
                fighterA.name
            )}

            <span
                style="color:#e10600;"
            >
                VS
            </span>

            ${escapeHtml(
                fighterB.name
            )}

        </h3>


        <p>

            <strong>
                ${escapeHtml(
                    winnerText
                )}
            </strong>

        </p>


        <p
            style="margin-top:8px;"
        >

            <span class="method">

                ${escapeHtml(
                    result.method
                )}

            </span>

            • Ronde
            ${result.round}

            •
            ${escapeHtml(
                result.time
            )}

        </p>


        <p
            style="
                color:#777;
                margin-top:8px;
            "
        >

            ${escapeHtml(
                event.name
            )}

        </p>

    `;

}


/*
==================================================
RESULTATEN WEERGEVEN
==================================================
*/

function displayResults() {

    reloadData();


    const list =
        document.getElementById(
            "resultsList"
        );


    list.innerHTML = "";


    let found = false;


    const completedResults = [];


    events.forEach(
        event => {

            if (
                !Array.isArray(
                    event.fights
                )
            ) {

                return;

            }


            event.fights.forEach(
                fight => {

                    if (
                        !fight.result
                    ) {

                        return;

                    }


                    found = true;


                    completedResults.push({

                        event:
                            event,

                        fight:
                            fight

                    });

                }
            );

        }
    );


    /*
    Nieuwste eerst.
    */

    completedResults.reverse();


    completedResults.forEach(
        item => {

            list.innerHTML += `

                <div class="result">

                    ${getResultText(
                        item.event,
                        item.fight
                    )}

                </div>

            `;

        }
    );


    if (!found) {

        list.innerHTML = `

            <div class="empty">

                Nog geen resultaten.

            </div>

        `;

    }

}


/*
==================================================
MESSAGES
==================================================
*/

function hideMessages() {

    document.getElementById(
        "success"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "none";

}


function showSuccess(
    message
) {

    const success =
        document.getElementById(
            "success"
        );


    success.textContent =
        message;


    success.style.display =
        "block";


    setTimeout(
        () => {

            success.style.display =
                "none";

        },
        4000
    );

}


function showError(
    message
) {

    const error =
        document.getElementById(
            "error"
        );


    error.textContent =
        message;


    error.style.display =
        "block";

}


/*
==================================================
HTML VEILIG MAKEN
==================================================
*/

function escapeHtml(text) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/*
==================================================
START
==================================================
*/

loadFights();

displayResults();
