<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Matchmaker - MMA Matchmaker</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #090909;

            color: white;

        }


        header {

            background: #111;

            border-bottom:
                2px solid #e10600;

            padding: 18px 35px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .logo span {

            color: #e10600;

        }


        nav {

            display: flex;

            flex-wrap: wrap;

            justify-content: flex-end;

        }


        nav a {

            color: #aaa;

            text-decoration: none;

            margin-left: 18px;

            font-size: 14px;

            font-weight: bold;

        }


        nav a:hover {

            color: white;

        }


        .container {

            max-width: 1100px;

            margin: auto;

            padding: 40px 20px;

        }


        h1 {

            margin-bottom: 8px;

        }


        .subtitle {

            color: #777;

            margin-bottom: 30px;

        }


        .card {

            background: #151515;

            border:
                1px solid #292929;

            border-radius: 10px;

            padding: 25px;

            margin-bottom: 25px;

        }


        .card h2 {

            margin-bottom: 20px;

        }


        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;

        }


        .field {

            margin-bottom: 18px;

        }


        label {

            display: block;

            color: #aaa;

            margin-bottom: 8px;

            font-size: 14px;

        }


        select,
        input {

            width: 100%;

            padding: 14px;

            background: #222;

            color: white;

            border:
                1px solid #444;

            border-radius: 7px;

            font-size: 15px;

        }


        select:focus,
        input:focus {

            outline: none;

            border-color:
                #e10600;

        }


        .full {

            grid-column:
                1 / -1;

        }


        .checkbox {

            display: flex;

            align-items: center;

            gap: 10px;

            background: #101010;

            border:
                1px solid #333;

            border-radius: 7px;

            padding: 15px;

        }


        .checkbox input {

            width: auto;

        }


        .checkbox label {

            margin: 0;

            color: white;

            cursor: pointer;

        }


        .button {

            width: 100%;

            padding: 16px;

            background: #e10600;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

        }


        .button:hover {

            background: #ff211a;

        }


        .secondary {

            background: #222;

            border:
                1px solid #444;

            margin-top: 10px;

        }


        .secondary:hover {

            background: #333;

        }


        .preview {

            background: #0d0d0d;

            border:
                1px solid #333;

            border-radius: 10px;

            padding: 25px;

            text-align: center;

        }


        .preview-label {

            color: #e10600;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;

        }


        .preview-fight {

            font-size: 25px;

            font-weight: bold;

        }


        .preview-fight span {

            color: #e10600;

            margin: 0 10px;

        }


        .preview-info {

            color: #777;

            margin-top: 12px;

        }


        .fight-list {

            display: grid;

            gap: 12px;

        }


        .fight {

            background: #101010;

            border:
                1px solid #333;

            border-radius: 8px;

            padding: 18px;

        }


        .fight-top {

            display: flex;

            justify-content:
                space-between;

            gap: 15px;

            margin-bottom: 8px;

        }


        .fight-number {

            color: #777;

        }


        .badge {

            padding:
                4px 8px;

            border-radius: 5px;

            background: #292929;

            color: #ccc;

            font-size: 11px;

            font-weight: bold;

        }


        .title-badge {

            background: #5c4b00;

            color: #ffd700;

        }


        .main-badge {

            background: #e10600;

            color: white;

        }


        .fight-names {

            font-size: 19px;

            font-weight: bold;

        }


        .fight-names span {

            color: #e10600;

            margin: 0 7px;

        }


        .fight-info {

            color: #777;

            font-size: 13px;

            margin-top: 7px;

        }


        .delete {

            margin-top: 12px;

            background: #252525;

            border:
                1px solid #444;

            color: #aaa;

            padding: 9px 12px;

            border-radius: 5px;

            cursor: pointer;

        }


        .delete:hover {

            background: #333;

            color: white;

        }


        .message {

            display: none;

            padding: 15px;

            border-radius: 7px;

            margin-top: 15px;

            text-align: center;

        }


        .success {

            background: #12351f;

            border:
                1px solid #1f7540;

            color: #6ee7a0;

        }


        .error {

            background: #3a1111;

            border:
                1px solid #6d2222;

            color: #ff8b8b;

        }


        .empty {

            color: #666;

            text-align: center;

            padding: 20px;

        }


        @media (max-width: 750px) {

            header {

                flex-direction: column;

                gap: 18px;

            }


            nav {

                justify-content: center;

            }


            nav a {

                margin: 5px 7px;

            }


            .grid {

                grid-template-columns: 1fr;

            }


            .full {

                grid-column:
                    auto;

            }


            .preview-fight {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<header>


    <div class="logo">

        MMA
        <span>MATCHMAKER</span>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

        <a href="fighter-profile.html">
            Profiles
        </a>

        <a href="admin.html">
            Admin
        </a>

    </nav>

</header>


<div class="container">


    <h1>
        🥊 Matchmaker
    </h1>


    <p class="subtitle">

        Maak zelf de fights voor je MMA-organisatie.

    </p>


    <!-- FIGHT MAKEN -->


    <div class="card">

        <h2>
            Nieuwe Fight
        </h2>


        <div class="grid">


            <!-- EVENT -->


            <div class="field">

                <label>
                    Event
                </label>


                <select
                    id="event"
                    onchange="updatePreview()"
                >

                    <option value="">
                        Kies een event
                    </option>

                </select>

            </div>


            <!-- GEWICHTSKLASSE -->


            <div class="field">

                <label>
                    Gewichtsklasse
                </label>


                <select
                    id="weightClass"
                    onchange="loadFighters()"
                >

                    <option value="">
                        Kies gewichtsklasse
                    </option>

                    <option>
                        Flyweight
                    </option>

                    <option>
                        Bantamweight
                    </option>

                    <option>
                        Featherweight
                    </option>

                    <option>
                        Lightweight
                    </option>

                    <option>
                        Welterweight
                    </option>

                    <option>
                        Middleweight
                    </option>

                    <option>
                        Light Heavyweight
                    </option>

                    <option>
                        Heavyweight
                    </option>

                </select>

            </div>


            <!-- FIGHTER A -->


            <div class="field">

                <label>
                    Fighter A
                </label>


                <select
                    id="fighterA"
                    onchange="updatePreview()"
                >

                    <option value="">
                        Kies Fighter A
                    </option>

                </select>

            </div>


            <!-- FIGHTER B -->


            <div class="field">

                <label>
                    Fighter B
                </label>


                <select
                    id="fighterB"
                    onchange="updatePreview()"
                >

                    <option value="">
                        Kies Fighter B
                    </option>

                </select>

            </div>


            <!-- FIGHT TYPE -->


            <div class="field">

                <label>
                    Fight type
                </label>


                <select
                    id="fightType"
                    onchange="updatePreview()"
                >

                    <option value="Regular">
                        Regular Fight
                    </option>

                    <option value="Title">
                        🏆 Title Fight
                    </option>

                </select>

            </div>


            <!-- FIGHT POSITION -->


            <div class="field">

                <label>
                    Positie op card
                </label>


                <select
                    id="position"
                    onchange="updatePreview()"
                >

                    <option value="Regular">
                        Regular
                    </option>

                    <option value="Preliminary">
                        Preliminary
                    </option>

                    <option value="Featured">
                        Featured
                    </option>

                    <option value="Co-Main Event">
                        Co-Main Event
                    </option>

                    <option value="Main Event">
                        🔥 Main Event
                    </option>

                </select>

            </div>


            <!-- RONDES -->


            <div class="field">

                <label>
                    Aantal rondes
                </label>


                <select
                    id="rounds"
                    onchange="updatePreview()"
                >

                    <option value="3">
                        3 Rounds
                    </option>

                    <option value="5">
                        5 Rounds
                    </option>

                </select>

            </div>


            <!-- TITLE NAME -->


            <div class="field">

                <label>
                    Titel
                </label>


                <input
                    id="titleName"
                    type="text"
                    placeholder="Bijv. Lightweight Championship"
                    oninput="updatePreview()"
                >

            </div>


            <!-- CHECKBOX -->


            <div class="full">

                <div class="checkbox">

                    <input
                        id="titleOnLine"
                        type="checkbox"
                        onchange="updatePreview()"
                    >


                    <label
                        for="titleOnLine"
                    >

                        🏆 Titel staat op het spel

                    </label>

                </div>

            </div>


            <!-- BUTTON -->


            <div class="full">

                <button
                    class="button"
                    onclick="createFight()"
                >

                    ➕ Fight toevoegen aan event

                </button>


                <button
                    class="button secondary"
                    onclick="clearForm()"
                >

                    Wissen

                </button>


                <div
                    id="success"
                    class="message success"
                >

                    Fight toegevoegd! 🔥

                </div>


                <div
                    id="error"
                    class="message error"
                ></div>

            </div>


        </div>

    </div>


    <!-- PREVIEW -->


    <div class="card">

        <h2>
            Fight Preview
        </h2>


        <div
            id="preview"
            class="preview"
        >

            <div class="preview-label">

                FIGHT PREVIEW

            </div>


            <div class="preview-fight">

                Fighter A

                <span>
                    VS
                </span>

                Fighter B

            </div>


            <div class="preview-info">

                Kies fighters om de fight te bekijken.

            </div>

        </div>

    </div>


    <!-- EVENT FIGHTS -->


    <div class="card">

        <h2>

            Fights van geselecteerd event

        </h2>


        <div
            id="fightList"
            class="fight-list"
        ></div>

    </div>


</div>


<script>


/*
==================================================
DATA
==================================================
*/


let fighters =
    JSON.parse(
        localStorage.getItem(
            "fighters"
        )
    ) || [];


let events =
    JSON.parse(
        localStorage.getItem(
            "events"
        )
    ) || [];



/*
==================================================
OPSLAAN
==================================================
*/


function saveEvents() {

    localStorage.setItem(
        "events",
        JSON.stringify(events)
    );

}



/*
==================================================
EVENTS LADEN
==================================================
*/


function loadEvents() {


    const select =
        document.getElementById(
            "event"
        );


    select.innerHTML = `

        <option value="">

            Kies een event

        </option>

    `;


    events.forEach(
        event => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                event.id;


            option.textContent =
                event.name ||
                "Unnamed Event";


            select.appendChild(
                option
            );

        }
    );

}



/*
==================================================
FIGHTERS LADEN
==================================================
*/


function loadFighters() {


    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const fighterA =
        document.getElementById(
            "fighterA"
        );


    const fighterB =
        document.getElementById(
            "fighterB"
        );


    fighterA.innerHTML = `

        <option value="">

            Kies Fighter A

        </option>

    `;


    fighterB.innerHTML = `

        <option value="">

            Kies Fighter B

        </option>

    `;


    if (!weightClass) {

        updatePreview();

        return;

    }


    const division =
        fighters.filter(
            fighter =>
                fighter.weightClass ===
                weightClass
        );


    division.forEach(
        fighter => {


            const optionA =
                document.createElement(
                    "option"
                );


            optionA.value =
                fighter.id;


            optionA.textContent =
                fighter.name;


            fighterA.appendChild(
                optionA
            );


            const optionB =
                document.createElement(
                    "option"
                );


            optionB.value =
                fighter.id;


            optionB.textContent =
                fighter.name;


            fighterB.appendChild(
                optionB
            );

        }
    );


    updatePreview();

}



/*
==================================================
FIGHTER OPZOEKEN
==================================================
*/


function getFighter(id) {

    return fighters.find(
        fighter =>
            fighter.id == id
    );

}



/*
==================================================
EVENT OPZOEKEN
==================================================
*/


function getEvent(id) {

    return events.find(
        event =>
            event.id == id
    );

}



/*
==================================================
PREVIEW
==================================================
*/


function updatePreview() {


    const fighterA =
        getFighter(
            document.getElementById(
                "fighterA"
            ).value
        );


    const fighterB =
        getFighter(
            document.getElementById(
                "fighterB"
            ).value
        );


    const event =
        getEvent(
            document.getElementById(
                "event"
            ).value
        );


    const fightType =
        document.getElementById(
            "fightType"
        ).value;


    const position =
        document.getElementById(
            "position"
        ).value;


    const rounds =
        document.getElementById(
            "rounds"
        ).value;


    const titleName =
        document.getElementById(
            "titleName"
        ).value.trim();


    const titleOnLine =
        document.getElementById(
            "titleOnLine"
        ).checked;


    const preview =
        document.getElementById(
            "preview"
        );


    const nameA =
        fighterA
            ? fighterA.name
            : "Fighter A";


    const nameB =
        fighterB
            ? fighterB.name
            : "Fighter B";


    let extra = "";


    if (fightType === "Title") {

        extra +=
            "🏆 Titelgevecht";


    }


    if (titleOnLine) {

        if (extra) {

            extra += " • ";

        }


        extra +=
            "Titel op het spel";

    }


    if (position !== "Regular") {

        if (extra) {

            extra += " • ";

        }


        extra +=
            position;

    }


    if (!extra) {

        extra =
            "Regular Fight";

    }


    if (event) {

        extra +=
            " • " +
            event.name;

    }


    preview.innerHTML = `

        <div class="preview-label">

            FIGHT PREVIEW

        </div>


        <div class="preview-fight">

            ${nameA}

            <span>
                VS
            </span>

            ${nameB}

        </div>


        <div class="preview-info">

            ${extra}

            •

            ${rounds} Rounds

            ${
                titleName
                    ? " • " + titleName
                    : ""
            }

        </div>

    `;

}



/*
==================================================
FIGHT MAKEN
==================================================
*/


function createFight() {


    hideMessages();


    const eventId =
        document.getElementById(
            "event"
        ).value;


    const fighterAId =
        document.getElementById(
            "fighterA"
        ).value;


    const fighterBId =
        document.getElementById(
            "fighterB"
        ).value;


    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const fightType =
        document.getElementById(
            "fightType"
        ).value;


    const position =
        document.getElementById(
            "position"
        ).value;


    const rounds =
        Number(
            document.getElementById(
                "rounds"
            ).value
        );


    const titleName =
        document.getElementById(
            "titleName"
        ).value.trim();


    const titleOnLine =
        document.getElementById(
            "titleOnLine"
        ).checked;


    /*
    ------------------------------------------
    CONTROLE
    ------------------------------------------
    */


    if (!eventId) {

        showError(
            "Kies eerst een event."
        );

        return;

    }


    if (!fighterAId) {

        showError(
            "Kies Fighter A."
        );

        return;

    }


    if (!fighterBId) {

        showError(
            "Kies Fighter B."
        );

        return;

    }


    if (
        fighterAId ===
        fighterBId
    ) {

        showError(
            "Een fighter kan niet tegen zichzelf vechten."
        );

        return;

    }


    if (!weightClass) {

        showError(
            "Kies een gewichtsklasse."
        );

        return;

    }


    /*
    ------------------------------------------
    FIGHTERS
    ------------------------------------------
    */


    const fighterA =
        getFighter(
            fighterAId
        );


    const fighterB =
        getFighter(
            fighterBId
        );


    if (!fighterA || !fighterB) {

        showError(
            "Fighter niet gevonden."
        );

        return;

    }


    /*
    ------------------------------------------
    EVENT
    ------------------------------------------
    */


    const event =
        getEvent(
            eventId
        );


    if (!event) {

        showError(
            "Event niet gevonden."
        );

        return;

    }


    /*
    ------------------------------------------
    FIGHTS ARRAY
    ------------------------------------------
    */


    if (
        !Array.isArray(
            event.fights
        )
    ) {

        event.fights = [];

    }


    /*
    ------------------------------------------
    ID
    ------------------------------------------
    */


    const fightId =
        Date.now() +
        Math.floor(
            Math.random() * 10000
        );


    /*
    ------------------------------------------
    FIGHT OBJECT
    ------------------------------------------
    */


    const fight = {

        id: fightId,

        fighterA:
            fighterA.id,

        fighterB:
            fighterB.id,

        weightClass:
            weightClass,

        fightType:
            fightType,

        position:
            position,

        rounds:
            rounds,

        titleName:
            titleName,

        titleOnLine:
            titleOnLine,

        result:
            null

    };


    /*
    ------------------------------------------
    TOEVOEGEN
    ------------------------------------------
    */


    event.fights.push(
        fight
    );


    saveEvents();


    /*
    ------------------------------------------
    SUCCES
    ------------------------------------------
    */


    showSuccess(
        fighterA.name +
        " vs " +
        fighterB.name +
        " is toegevoegd aan " +
        event.name +
        "!"
    );


    /*
    ------------------------------------------
    LIJST VERNIEUWEN
    ------------------------------------------
    */


    displayEventFights(
        event.id
    );


    /*
    ------------------------------------------
    FORMULIER LEGEN
    ------------------------------------------
    */


    document.getElementById(
        "fighterA"
    ).value = "";


    document.getElementById(
        "fighterB"
    ).value = "";


    document.getElementById(
        "titleName"
    ).value = "";


    document.getElementById(
        "titleOnLine"
    ).checked = false;


    document.getElementById(
        "fightType"
    ).value =
        "Regular";


    document.getElementById(
        "position"
    ).value =
        "Regular";


    document.getElementById(
        "rounds"
    ).value =
        "3";


    updatePreview();

}



/*
==================================================
EVENT FIGHTS WEERGEVEN
==================================================
*/


function displayEventFights(
    eventId
) {


    const box =
        document.getElementById(
            "fightList"
        );


    box.innerHTML = "";


    if (!eventId) {

        box.innerHTML = `

            <div class="empty">

                Kies een event om de
                fights te bekijken.

            </div>

        `;

        return;

    }


    const event =
        getEvent(
            eventId
        );


    if (!event) {

        return;

    }


    if (
        !Array.isArray(
            event.fights
        ) ||
        event.fights.length === 0
    ) {

        box.innerHTML = `

            <div class="empty">

                Dit event heeft nog geen fights.

            </div>

        `;

        return;

    }


    event.fights.forEach(
        (fight, index) => {


            const fighterA =
                getFighter(
                    fight.fighterA
                );


            const fighterB =
                getFighter(
                    fight.fighterB
                );


            const nameA =
                fighterA
                    ? fighterA.name
                    : "Fighter A";


            const nameB =
                fighterB
                    ? fighterB.name
                    : "Fighter B";


            let badges = "";


            if (
                fight.fightType ===
                "Title"
            ) {

                badges += `

                    <span class="badge title-badge">

                        🏆 TITLE

                    </span>

                `;

            }


            if (
                fight.position ===
                "Main Event"
            ) {

                badges += `

                    <span class="badge main-badge">

                        MAIN EVENT

                    </span>

                `;

            }


            else if (
                fight.position ===
                "Co-Main Event"
            ) {

                badges += `

                    <span class="badge">

                        CO-MAIN EVENT

                    </span>

                `;

            }


            box.innerHTML += `

                <div class="fight">


                    <div class="fight-top">

                        <div class="fight-number">

                            Fight #${index + 1}

                        </div>


                        <div>

                            ${badges}

                        </div>

                    </div>


                    <div class="fight-names">

                        ${nameA}

                        <span>
                            VS
                        </span>

                        ${nameB}

                    </div>


                    <div class="fight-info">

                        ${fight.weightClass}

                        •

                        ${fight.rounds}
                        Rounds

                        ${
                            fight.titleName
                                ? " • " +
                                  fight.titleName
                                : ""
                        }

                    </div>


                    <button
                        class="delete"
                        onclick="
                            deleteFight(
                                ${event.id},
                                ${fight.id}
                            )
                        "
                    >

                        🗑️ Fight verwijderen

                    </button>


                </div>

            `;

        }
    );

}



/*
==================================================
FIGHT VERWIJDEREN
==================================================
*/


function deleteFight(
    eventId,
    fightId
) {


    const event =
        getEvent(
            eventId
        );


    if (!event) {

        return;

    }


    const confirmed =
        confirm(
            "Weet je zeker dat je deze fight wilt verwijderen?"
        );


    if (!confirmed) {

        return;

    }


    event.fights =
        event.fights.filter(
            fight =>
                fight.id !==
                fightId
        );


    saveEvents();


    displayEventFights(
        eventId
    );


    showSuccess(
        "Fight verwijderd."
    );

}



/*
==================================================
FORMULIER WISSEN
==================================================

function clearForm() {


    document.getElementById(
        "fighterA"
    ).value = "";


    document.getElementById(
        "fighterB"
    ).value = "";


    document.getElementById(
        "fightType"
    ).value =
        "Regular";


    document.getElementById(
        "position"
    ).value =
        "Regular";


    document.getElementById(
        "rounds"
    ).value =
        "3";


    document.getElementById(
        "titleName"
    ).value = "";


    document.getElementById(
        "titleOnLine"
    ).checked = false;


    hideMessages();


    updatePreview();

}



/*
==================================================
MESSAGES
==================================================
*/


function hideMessages() {


    document.getElementById(
        "success"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "none";

}



function showSuccess(
    message
) {


    const box =
        document.getElementById(
            "success"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3500
    );

}



function showError(
    message
) {


    const box =
        document.getElementById(
            "error"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}



/*
==================================================

*/


document
    .getElementById(
        "event"
    )
    .addEventListener(
        "change",
        function() {

            displayEventFights(
                this.value
            );

            updatePreview();

        }
    );
