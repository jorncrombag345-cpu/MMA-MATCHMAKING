<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Matchmaker - MMA Matchmaker</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #090909;
    color: white;
}

header {
    background: #111;
    border-bottom: 2px solid #e10600;
    padding: 18px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #e10600;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
}

nav a {
    color: #aaa;
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
    font-weight: bold;
}

nav a:hover {
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

.card {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 25px;
}

.card h2 {
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    color: #aaa;
    margin-bottom: 8px;
    font-size: 14px;
}

select,
input {
    width: 100%;
    padding: 14px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 7px;
    font-size: 15px;
}

select:focus,
input:focus {
    outline: none;
    border-color: #e10600;
}

.full {
    grid-column: 1 / -1;
}

.checkbox {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #101010;
    border: 1px solid #333;
    border-radius: 7px;
    padding: 15px;
}

.checkbox input {
    width: auto;
}

.checkbox label {
    margin: 0;
    color: white;
    cursor: pointer;
}

.button {
    width: 100%;
    padding: 16px;
    background: #e10600;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.button:hover {
    background: #ff211a;
}

.secondary {
    background: #222;
    border: 1px solid #444;
    margin-top: 10px;
}

.secondary:hover {
    background: #333;
}

.preview {
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 25px;
    text-align: center;
}

.preview-label {
    color: #e10600;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.preview-fight {
    font-size: 25px;
    font-weight: bold;
}

.preview-fight span {
    color: #e10600;
    margin: 0 10px;
}

.preview-info {
    color: #777;
    margin-top: 12px;
}

.fight-list {
    display: grid;
    gap: 15px;
}

.fight {
    background: #101010;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
}

.fight-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 10px;
}

.fight-number {
    color: #777;
}

.badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.badge {
    padding: 5px 8px;
    border-radius: 5px;
    background: #292929;
    color: #ccc;
    font-size: 11px;
    font-weight: bold;
}

.title-badge {
    background: #5c4b00;
    color: #ffd700;
}

.main-badge {
    background: #e10600;
    color: white;
}

.result-badge {
    background: #12351f;
    color: #6ee7a0;
}

.fight-names {
    font-size: 20px;
    font-weight: bold;
}

.fight-names span {
    color: #e10600;
    margin: 0 7px;
}

.fight-info {
    color: #777;
    font-size: 13px;
    margin-top: 8px;
}

.result-display {
    margin-top: 12px;
    padding: 12px;
    background: #151515;
    border-radius: 7px;
    border: 1px solid #333;
    color: #6ee7a0;
}

.result-box {
    margin-top: 18px;
    padding: 18px;
    background: #0c0c0c;
    border: 1px solid #333;
    border-radius: 8px;
}

.result-box h3 {
    margin-bottom: 15px;
}

.result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.result-button {
    padding: 12px;
    border: 1px solid #444;
    background: #222;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.result-button:hover {
    background: #333;
    border-color: #e10600;
}

.result-button.win-a:hover {
    border-color: #35d07f;
}

.result-button.win-b:hover {
    border-color: #35d07f;
}

.result-button.draw:hover {
    border-color: #ffd700;
}

.result-button.nc:hover {
    border-color: #999;
}

.method-select {
    margin-top: 12px;
}

.method-select label {
    margin-bottom: 6px;
}

.result-method {
    width: 100%;
    padding: 11px;
    background: #222;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
}

.delete {
    margin-top: 12px;
    background: #252525;
    border: 1px solid #444;
    color: #aaa;
    padding: 9px 12px;
    border-radius: 5px;
    cursor: pointer;
}

.delete:hover {
    background: #333;
    color: white;
}

.message {
    display: none;
    padding: 15px;
    border-radius: 7px;
    margin-top: 15px;
    text-align: center;
}

.success {
    background: #12351f;
    border: 1px solid #1f7540;
    color: #6ee7a0;
}

.error {
    background: #3a1111;
    border: 1px solid #6d2222;
    color: #ff8b8b;
}

.empty {
    color: #666;
    text-align: center;
    padding: 20px;
}

.warning {
    background: #3a2d05;
    border: 1px solid #806400;
    color: #ffd700;
    padding: 12px;
    border-radius: 7px;
    margin-top: 12px;
    font-size: 13px;
}

@media (max-width: 750px) {

    header {
        flex-direction: column;
        gap: 18px;
    }

    nav {
        justify-content: center;
    }

    nav a {
        margin: 5px 7px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .preview-fight {
        font-size: 20px;
    }

    .result-grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<header>

<div class="logo">

MMA
<span>MATCHMAKER</span>

</div>

<nav>

<a href="index.html">
Home
</a>

<a href="fighters.html">
Fighters
</a>

<a href="rankings.html">
Rankings
</a>

<a href="events.html">
Events
</a>

<a href="matchmaker.html">
Matchmaker
</a>

<a href="fighter-profile.html">
Profiles
</a>

<a href="news.html">
Nieuws
</a>

<a href="admin.html">
Admin
</a>

</nav>

</header>

<div class="container">

<h1>
🥊 Matchmaker
</h1>

<p class="subtitle">

Maak fights, voeg ze toe aan events en verwerk later de resultaten.

</p>


<!-- =========================================
     NIEUWE FIGHT
========================================= -->

<div class="card">

<h2>
Nieuwe Fight
</h2>

<div class="grid">


<div class="field">

<label>
Event
</label>

<select
id="event"
onchange="updatePreview()"
>

<option value="">
Kies een event
</option>

</select>

</div>


<div class="field">

<label>
Gewichtsklasse
</label>

<select
id="weightClass"
onchange="loadFighters()"
>

<option value="">
Kies gewichtsklasse
</option>

<option>Flyweight</option>
<option>Bantamweight</option>
<option>Featherweight</option>
<option>Lightweight</option>
<option>Welterweight</option>
<option>Middleweight</option>
<option>Light Heavyweight</option>
<option>Heavyweight</option>

</select>

</div>


<div class="field">

<label>
Fighter A
</label>

<select
id="fighterA"
onchange="updatePreview()"
>

<option value="">
Kies Fighter A
</option>

</select>

</div>


<div class="field">

<label>
Fighter B
</label>

<select
id="fighterB"
onchange="updatePreview()"
>

<option value="">
Kies Fighter B
</option>

</select>

</div>


<div class="field">

<label>
Fight type
</label>

<select
id="fightType"
onchange="updatePreview()"
>

<option value="Regular">
Regular Fight
</option>

<option value="Title">
🏆 Title Fight
</option>

</select>

</div>


<div class="field">

<label>
Positie op card
</label>

<select
id="position"
onchange="updatePreview()"
>

<option value="Regular">
Regular
</option>

<option value="Preliminary">
Preliminary
</option>

<option value="Featured">
Featured
</option>

<option value="Co-Main Event">
Co-Main Event
</option>

<option value="Main Event">
🔥 Main Event
</option>

</select>

</div>


<div class="field">

<label>
Aantal rondes
</label>

<select
id="rounds"
onchange="updatePreview()"
>

<option value="3">
3 Rounds
</option>

<option value="5">
5 Rounds
</option>

</select>

</div>


<div class="field">

<label>
Titel
</label>

<input
id="titleName"
type="text"
placeholder="Bijv. Lightweight Championship"
oninput="updatePreview()"
>

</div>


<div class="full">

<div class="checkbox">

<input
id="titleOnLine"
type="checkbox"
onchange="updatePreview()"
>

<label for="titleOnLine">

🏆 Titel staat op het spel

</label>

</div>

</div>


<div class="full">

<button
class="button"
onclick="createFight()"
>

➕ Fight toevoegen aan event

</button>

<button
class="button secondary"
onclick="clearForm()"
>

Wissen

</button>

<div
id="success"
class="message success"
></div>

<div
id="error"
class="message error"
></div>

</div>

</div>

</div>


<!-- =========================================
     PREVIEW
========================================= -->

<div class="card">

<h2>
Fight Preview
</h2>

<div
id="preview"
class="preview"
>

<div class="preview-label">
FIGHT PREVIEW
</div>

<div class="preview-fight">

Fighter A

<span>
VS
</span>

Fighter B

</div>

<div class="preview-info">

Kies fighters om de fight te bekijken.

</div>

</div>

</div>


<!-- =========================================
     EVENT FIGHTS
========================================= -->

<div class="card">

<h2>
Fights van geselecteerd event
</h2>

<div
id="fightList"
class="fight-list"
></div>

</div>

</div>


<script>

/*
==================================================
DATA
==================================================
*/

let fighters =
JSON.parse(
localStorage.getItem("fighters")
) || [];

let events =
JSON.parse(
localStorage.getItem("events")
) || [];


/*
==================================================
OPSLAAN
==================================================
*/

function saveEvents() {

localStorage.setItem(
"events",
JSON.stringify(events)
);

}

function saveFighters() {

localStorage.setItem(
"fighters",
JSON.stringify(fighters)
);

}


/*
==================================================
EVENTS LADEN
==================================================
*/

function loadEvents() {

const select =
document.getElementById("event");

select.innerHTML = `

<option value="">
Kies een event
</option>

`;

events.forEach(event => {

const option =
document.createElement("option");

option.value =
event.id;

option.textContent =
event.name || "Unnamed Event";

select.appendChild(option);

});

}


/*
==================================================
FIGHTERS LADEN
==================================================
*/

function loadFighters() {

const weightClass =
document.getElementById(
"weightClass"
).value;

const fighterA =
document.getElementById(
"fighterA"
);

const fighterB =
document.getElementById(
"fighterB"
);

fighterA.innerHTML = `

<option value="">
Kies Fighter A
</option>

`;

fighterB.innerHTML = `

<option value="">
Kies Fighter B
</option>

`;

if (!weightClass) {

updatePreview();

return;

}

const division =
fighters.filter(
fighter =>
fighter.weightClass ===
weightClass
);

division.forEach(fighter => {

const optionA =
document.createElement("option");

optionA.value =
fighter.id;

optionA.textContent =
fighter.name +
(
fighter.ranking
? " (#" + fighter.ranking + ")"
: ""
);

fighterA.appendChild(optionA);


const optionB =
document.createElement("option");

optionB.value =
fighter.id;

optionB.textContent =
fighter.name +
(
fighter.ranking
? " (#" + fighter.ranking + ")"
: ""
);

fighterB.appendChild(optionB);

});

updatePreview();

}


/*
==================================================
FIGHTER OPZOEKEN
==================================================
*/

function getFighter(id) {

return fighters.find(
fighter =>
fighter.id == id
);

}


/*
==================================================
EVENT OPZOEKEN
==================================================
*/

function getEvent(id) {

return events.find(
event =>
event.id == id
);

}


/*
==================================================
PREVIEW
==================================================
*/

function updatePreview() {

const fighterA =
getFighter(
document.getElementById(
"fighterA"
).value
);

const fighterB =
getFighter(
document.getElementById(
"fighterB"
).value
);

const event =
getEvent(
document.getElementById(
"event"
).value
);

const fightType =
document.getElementById(
"fightType"
).value;

const position =
document.getElementById(
"position"
).value;

const rounds =
document.getElementById(
"rounds"
).value;

const titleName =
document.getElementById(
"titleName"
).value.trim();

const titleOnLine =
document.getElementById(
"titleOnLine"
).checked;

const preview =
document.getElementById(
"preview"
);

const nameA =
fighterA
? fighterA.name
: "Fighter A";

const nameB =
fighterB
? fighterB.name
: "Fighter B";

let extra = "";

if (fightType === "Title") {

extra += "🏆 Titelgevecht";

}

if (titleOnLine) {

if (extra) {
extra += " • ";
}

extra +=
"Titel op het spel";

}

if (position !== "Regular") {

if (extra) {
extra += " • ";
}

extra += position;

}

if (!extra) {

extra =
"Regular Fight";

}

if (event) {

extra +=
" • " +
event.name;

}

preview.innerHTML = `

<div class="preview-label">
FIGHT PREVIEW
</div>

<div class="preview-fight">

${nameA}

<span>
VS
</span>

${nameB}

</div>

<div class="preview-info">

${extra}
•
${rounds} Rounds

${
titleName
? " • " + titleName
: ""
}

</div>

`;

}


/*
==================================================
FIGHT MAKEN
==================================================
*/

function createFight() {

hideMessages();

const eventId =
document.getElementById(
"event"
).value;

const fighterAId =
document.getElementById(
"fighterA"
).value;

const fighterBId =
document.getElementById(
"fighterB"
).value;

const weightClass =
document.getElementById(
"weightClass"
).value;

const fightType =
document.getElementById(
"fightType"
).value;

const position =
document.getElementById(
"position"
).value;

const rounds =
Number(
document.getElementById(
"rounds"
).value
);

const titleName =
document.getElementById(
"titleName"
).value.trim();

const titleOnLine =
document.getElementById(
"titleOnLine"
).checked;


if (!eventId) {

showError(
"Kies eerst een event."
);

return;

}

if (!fighterAId) {

showError(
"Kies Fighter A."
);

return;

}

if (!fighterBId) {

showError(
"Kies Fighter B."
);

return;

}

if (fighterAId === fighterBId) {

showError(
"Een fighter kan niet tegen zichzelf vechten."
);

return;

}

if (!weightClass) {

showError(
"Kies een gewichtsklasse."
);

return;

}


const fighterA =
getFighter(fighterAId);

const fighterB =
getFighter(fighterBId);

const event =
getEvent(eventId);


if (!fighterA || !fighterB) {

showError(
"Fighter niet gevonden."
);

return;

}

if (!event) {

showError(
"Event niet gevonden."
);

return;

}


if (!Array.isArray(event.fights)) {

event.fights = [];

}


const fight = {

id:
Date.now() +
Math.floor(
Math.random() * 10000
),

fighterA:
fighterA.id,

fighterB:
fighterB.id,

weightClass:
weightClass,

fightType:
fightType,

position:
position,

rounds:
rounds,

titleName:
titleName,

titleOnLine:
titleOnLine,

result:
null,

resultProcessed:
false

};


event.fights.push(fight);

saveEvents();

showSuccess(
fighterA.name +
" vs " +
fighterB.name +
" is toegevoegd aan " +
event.name +
"!"
);

displayEventFights(event.id);

clearFightInputs();

}


/*
==================================================
FORMULIER NA FIGHT LEGEN
==================================================
*/

function clearFightInputs() {

document.getElementById(
"fighterA"
).value = "";

document.getElementById(
"fighterB"
).value = "";

document.getElementById(
"titleName"
).value = "";

document.getElementById(
"titleOnLine"
).checked = false;

document.getElementById(
"fightType"
).value =
"Regular";

document.getElementById(
"position"
).value =
"Regular";

document.getElementById(
"rounds"
).value =
"3";

updatePreview();

}


/*
==================================================
EVENT FIGHTS WEERGEVEN
==================================================
*/

function displayEventFights(eventId) {

const box =
document.getElementById(
"fightList"
);

box.innerHTML = "";

if (!eventId) {

box.innerHTML = `

<div class="empty">

Kies een event om de fights te bekijken.

</div>

`;

return;

}

const event =
getEvent(eventId);

if (!event) {

return;

}

if (
!Array.isArray(event.fights) ||
event.fights.length === 0
) {

box.innerHTML = `

<div class="empty">

Dit event heeft nog geen fights.

</div>

`;

return;

}


event.fights.forEach(
(fight, index) => {

const fighterA =
getFighter(
fight.fighterA
);

const fighterB =
getFighter(
fight.fighterB
);

const nameA =
fighterA
? fighterA.name
: "Fighter A";

const nameB =
fighterB
? fighterB.name
: "Fighter B";


let badges = "";


if (
fight.fightType ===
"Title"
) {

badges += `

<span class="badge title-badge">

🏆 TITLE

</span>

`;

}


if (
fight.position ===
"Main Event"
) {

badges += `

<span class="badge main-badge">

MAIN EVENT

</span>

`;

}

else if (
fight.position ===
"Co-Main Event"
) {

badges += `

<span class="badge">

CO-MAIN EVENT

</span>

`;

}


if (
fight.resultProcessed
) {

badges += `

<span class="badge result-badge">

✓ RESULTAAT VERWERKT

</span>

`;

}


let resultHTML = "";


if (fight.result) {

let resultText =
"Onbekend";

if (
fight.result.winner ===
"A"
) {

resultText =
nameA + " wint";

}

else if (
fight.result.winner ===
"B"
) {

resultText =
nameB + " wint";

}

else if (
fight.result.winner ===
"DRAW"
) {

resultText =
"Draw";

}

else if (
fight.result.winner ===
"NC"
) {

resultText =
"No Contest";

}


resultHTML = `

<div class="result-display">

🏆
<strong>
${escapeHtml(resultText)}
</strong>

${
fight.result.method
? " • " +
escapeHtml(
fight.result.method
)
: ""
}

</div>

`;

}


box.innerHTML += `

<div class="fight">

<div class="fight-top">

<div class="fight-number">

Fight #${index + 1}

</div>

<div class="badges">

${badges}

</div>

</div>


<div class="fight-names">

${escapeHtml(nameA)}

<span>
VS
</span>

${escapeHtml(nameB)}

</div>


<div class="fight-info">

${escapeHtml(
fight.weightClass
)}

•

${fight.rounds}
Rounds

${
fight.titleName
? " • " +
escapeHtml(
fight.titleName
)
: ""
}

</div>


${resultHTML}


${
!fight.resultProcessed
? `

<div class="result-box">

<h3>
🥊 Resultaat verwerken
</h3>

<div class="method-select">

<label>
Methode
</label>

<select
id="method-${fight.id}"
class="result-method"
>

<option value="Decision">
Decision
</option>

<option value="KO">
KO
</option>

<option value="TKO">
TKO
</option>

<option value="Submission">
Submission
</option>

<option value="Doctor Stoppage">
Doctor Stoppage
</option>

<option value="DQ">
Disqualification
</option>

<option value="Draw">
Draw
</option>

<option value="No Contest">
No Contest
</option>

</select>

</div>


<div class="result-grid">

<button
class="result-button win-a"
onclick="
processResult(
${event.id},
${fight.id},
'A'
)
"
>

🏆
${escapeHtml(nameA)}
wint

</button>


<button
class="result-button win-b"
onclick="
processResult(
${event.id},
${fight.id},
'B'
)
"
>

🏆
${escapeHtml(nameB)}
wint

</button>


<button
class="result-button draw"
onclick="
processResult(
${event.id},
${fight.id},
'DRAW'
)
"
>

🤝 Draw

</button>


<button
class="result-button nc"

/*
==================================================
RESULTAAT VERWERKEN
==================================================
*/

function processResult(
eventId,
fightId,
winner
) {

const event =
getEvent(eventId);

if (!event) {

showError(
"Event niet gevonden."
);

return;

}

const fight =
event.fights.find(
f =>
f.id == fightId
);

if (!fight) {

showError(
"Fight niet gevonden."
);

return;

}


if (fight.resultProcessed) {

showError(
"Dit resultaat is al verwerkt."
);

return;

}


const fighterA =
getFighter(
fight.fighterA
);

const fighterB =
getFighter(
fight.fighterB
);

if (!fighterA || !fighterB) {

showError(
"Een van de fighters bestaat niet meer."
);

return;

}


const methodElement =
document.getElementById(
"method-" + fight.id
);

const method =
methodElement
? methodElement.value
: "";


/*
------------------------------------------
BEVESTIGING
------------------------------------------
*/

let confirmation = "";

if (winner === "A") {

confirmation =
"Bevestig dat " +
fighterA.name +
" wint van " +
fighterB.name +
"?";

}

else if (winner === "B") {

confirmation =
"Bevestig dat " +
fighterB.name +
" wint van " +
fighterA.name +
"?";

}

else if (winner === "DRAW") {

confirmation =
"Bevestig deze fight als DRAW?";

}

else {

confirmation =
"Bevestig deze fight als NO CONTEST?";

}


if (!confirm(confirmation)) {

return;

}


/*
------------------------------------------
RECORD AANPASSEN
------------------------------------------
*/

if (winner === "A") {

addWin(
fighterA
);

addLoss(
fighterB
);

}

else if (winner === "B") {

addWin(
fighterB
);

addLoss(
fighterA
);

}

else if (winner === "DRAW") {

fighterA.draws =
Number(fighterA.draws || 0) + 1;

fighterB.draws =
Number(fighterB.draws || 0) + 1;

fighterA.streak = 0;
fighterB.streak = 0;

}

else if (winner === "NC") {

/*
No Contest verandert
het record NIET.

Ook de streak blijft hetzelfde.
*/

}


/*
------------------------------------------
RANKING SWAP
------------------------------------------
*/

if (
winner === "A" ||
winner === "B"
) {

const winningFighter =
winner === "A"
? fighterA
: fighterB;

const losingFighter =
winner === "A"
? fighterB
: fighterA;

swapRankingsIfNeeded(
winningFighter,
losingFighter
);

}


/*
------------------------------------------
TITLE
------------------------------------------
*/

if (
fight.titleOnLine === true ||
fight.fightType === "Title"
) {

handleTitleResult(
fight,
fighterA,
fighterB,
winner
);

}


/*
------------------------------------------
RESULT OPSLAAN
------------------------------------------
*/

fight.result = {

winner:
winner,

method:
method,

processedAt:
new Date().toISOString()

};

fight.resultProcessed =
true;


/*
------------------------------------------
OPSLAAN
------------------------------------------
*/

saveFighters();
saveEvents();


/*
------------------------------------------
LIJST VERNIEUWEN
------------------------------------------
*/

displayEventFights(
event.id
);


/*
------------------------------------------
MELDING
------------------------------------------
*/

let message = "";

if (winner === "A") {

message =
fighterA.name +
" heeft gewonnen. Record en streak zijn aangepast.";

}

else if (winner === "B") {

message =
fighterB.name +
" heeft gewonnen. Record en streak zijn aangepast.";

}

else if (winner === "DRAW") {

message =
"Draw verwerkt. Beide fighters hebben +1 draw.";

}

else {

message =
"No Contest verwerkt. Records zijn niet aangepast.";

}


showSuccess(message);

}


/*
==================================================
WIN TOEVOEGEN
==================================================
*/

function addWin(fighter) {

fighter.wins =
Number(fighter.wins || 0) + 1;

fighter.streak =
Number(fighter.streak || 0) + 1;

}


/*
==================================================
VERLIES TOEVOEGEN
==================================================
*/

function addLoss(fighter) {

fighter.losses =
Number(fighter.losses || 0) + 1;

fighter.streak = 0;

}


/*
==================================================
RANKING SWAP
==================================================

Voorbeeld:

#5 vs #7

#5 wint:

winnaar blijft #5
verliezer blijft #7

#7 wint:

winnaar wordt #5
verliezer wordt #7

Dus de winnaar neemt de hogere ranking
van de verliezer over wanneer hij lager
gerankt stond.

==================================================
*/

function swapRankingsIfNeeded(
winner,
loser
) {

const winnerRanking =
Number(winner.ranking);

const loserRanking =
Number(loser.ranking);


/*
Geen ranking = geen swap
*/

if (
!winner.ranking ||
!loser.ranking
) {

return;

}


/*
Zelfde ranking = niets doen
*/

if (
winnerRanking ===
loserRanking
) {

return;

}


/*
De lager gerankte winnaar
neemt de plek van de hoger
gerankte verliezer over.
*/

if (
winnerRanking >
loserRanking
) {

winner.ranking =
loserRanking;

loser.ranking =
winnerRanking;

}

}


/*
==================================================
TITLE RESULT
==================================================
*/

function handleTitleResult(
fight,
fighterA,
fighterB,
winner
) {

if (
winner !== "A" &&
winner !== "B"
) {

return;

}


/*
Alleen de winnaar wordt champion.
*/

const champion =
winner === "A"
? fighterA
: fighterB;


/*
Alle andere fighters in
dezelfde divisie verliezen
hun champion-status.
*/

fighters.forEach(
fighter => {

if (
fighter.weightClass ===
fight.weightClass
) {

fighter.champion =
false;

}

}
);


/*
Winnaar wordt champion.
*/

champion.champion =
true;

}


/*
==================================================
FIGHT VERWIJDEREN
==================================================
*/

function deleteFight(
eventId,
fightId
) {

const event =
getEvent(eventId);

if (!event) {

return;

}

const fight =
event.fights.find(
f =>
f.id == fightId
);

if (!fight) {

return;

}


/*
Als resultaat al verwerkt is,
waarschuwen we extra duidelijk.
*/

let message =
"Weet je zeker dat je deze fight wilt verwijderen?";


if (fight.resultProcessed) {

message +=
"\n\nLet op: het resultaat van deze fight is al verwerkt. Het verwijderen van de fight draait de record/ranking-aanpassingen NIET terug.";

}


if (!confirm(message)) {

return;

}


event.fights =
event.fights.filter(
f =>
f.id != fightId
);

saveEvents();

displayEventFights(
eventId
);

showSuccess(
"Fight verwijderd."
);

}

/*
==================================================
MESSAGES
==================================================
*/

function hideMessages() {

document.getElementById(
"success"
).style.display =
"none";

document.getElementById(
"error"
).style.display =
"none";

}


function showSuccess(message) {

const box =
document.getElementById(
"success"
);

box.textContent =
message;

box.style.display =
"block";

setTimeout(
() => {

box.style.display =
"none";

},
4000
);

}


function showError(message) {

const box =
document.getElementById(
"error"
);

box.textContent =
message;

box.style.display =
"block";

}

/*
==================================================
VEILIGE HTML
==================================================
*/

function escapeHtml(text) {

if (
text === null ||
text === undefined
) {

return "";

}

return String(text)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
