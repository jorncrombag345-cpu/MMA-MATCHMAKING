<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matchmaker - MMA Matchmaker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #111;
            border-bottom: 2px solid #e10600;

            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #e10600;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e10600;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .matchmaker {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 30px;
        }

        .fighter-grid {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            gap: 20px;
            align-items: center;
        }

        .fighter-box {
            background: #101010;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
        }

        .fighter-box h2 {
            margin-bottom: 15px;
        }

        select,
        input {
            width: 100%;
            padding: 13px;

            background: #222;
            color: white;

            border: 1px solid #444;
            border-radius: 6px;

            font-size: 15px;
        }

        .vs {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: #e10600;
        }

        .settings {
            margin-top: 30px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 20px;
        }

        .setting {
            background: #101010;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 18px;
        }

        .setting label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }

        .checkboxes {
            margin-top: 25px;

            display: flex;
            gap: 30px;

            flex-wrap: wrap;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #ccc;
        }

        .checkbox input {
            width: auto;
        }

        .create-button {
            width: 100%;

            margin-top: 30px;

            padding: 16px;

            background: #e10600;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 17px;

            font-weight: bold;
        }

        .create-button:hover {
            background: #ff211a;
        }

        .preview {
            margin-top: 30px;

            background: linear-gradient(
                135deg,
                #1b1b1b,
                #0e0e0e
            );

            border: 1px solid #333;

            border-radius: 10px;

            padding: 25px;

            text-align: center;
        }

        .preview h2 {
            margin-bottom: 15px;
        }

        .preview-fight {
            font-size: 26px;
            font-weight: bold;
        }

        .preview-fight span {
            color: #e10600;
            margin: 0 15px;
        }

        .preview-info {
            color: #888;
            margin-top: 10px;
        }

        .success {
            display: none;

            margin-top: 20px;

            background: #12351f;

            border: 1px solid #1f7540;

            color: #6ee7a0;

            padding: 15px;

            border-radius: 8px;

            text-align: center;
        }

        .empty {
            color: #777;

            background: #151515;

            padding: 20px;

            border-radius: 8px;

            text-align: center;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .fighter-grid {
                grid-template-columns: 1fr;
            }

            .vs {
                margin: -5px 0;
            }

            .settings {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        MMA <span>MATCHMAKER</span>
    </div>

    <nav>

        <a href="index.html">
            Dashboard
        </a>

        <a href="fighters.html">
            Fighters
        </a>

        <a href="rankings.html">
            Rankings
        </a>

        <a href="events.html">
            Events
        </a>

        <a href="matchmaker.html">
            Matchmaker
        </a>

    </nav>

</header>


<div class="container">

    <h1>
        🥊 Matchmaker
    </h1>

    <p class="subtitle">
        Stel je eigen MMA-gevecht samen.
    </p>


    <div class="matchmaker">


        <!-- FIGHTERS -->

        <div class="fighter-grid">


            <div class="fighter-box">

                <h2>
                    Fighter A
                </h2>

                <select
                    id="fighterA"
                    onchange="updatePreview()"
                >

                    <option value="">
                        Kies Fighter A
                    </option>

                </select>

            </div>


            <div class="vs">
                VS
            </div>


            <div class="fighter-box">

                <h2>
                    Fighter B
                </h2>

                <select
                    id="fighterB"
                    onchange="updatePreview()"
                >

                    <option value="">
                        Kies Fighter B
                    </option>

                </select>

            </div>


        </div>


        <!-- SETTINGS -->

        <div class="settings">


            <div class="setting">

                <label>
                    Gewichtsklasse
                </label>

                <select
                    id="weightClass"
                    onchange="updatePreview()"
                >

                    <option>
                        Flyweight
                    </option>

                    <option>
                        Bantamweight
                    </option>

                    <option>
                        Featherweight
                    </option>

                    <option>
                        Lightweight
                    </option>

                    <option>
                        Welterweight
                    </option>

                    <option>
                        Middleweight
                    </option>

                    <option>
                        Light Heavyweight
                    </option>

                    <option>
                        Heavyweight
                    </option>

                </select>

            </div>


            <div class="setting">

                <label>
                    Aantal rondes
                </label>

                <select id="rounds">

                    <option value="3">
                        3 rondes
                    </option>

                    <option value="5">
                        5 rondes
                    </option>

                </select>

            </div>


            <div class="setting">

                <label>
                    Event
                </label>

                <select id="event">

                    <option value="">
                        Kies een event
                    </option>

                </select>

            </div>


        </div>


        <!-- CHECKBOXES -->

        <div class="checkboxes">


            <label class="checkbox">

                <input
                    type="checkbox"
                    id="championship"
                >

                🏆 Championship Fight

            </label>


            <label class="checkbox">

                <input
                    type="checkbox"
                    id="mainEvent"
                >

                ⭐ Main Event

            </label>


        </div>


        <!-- PREVIEW -->

        <div class="preview">

            <h2>
                Fight Preview
            </h2>

            <div
                id="previewFight"
                class="preview-fight"
            >
                Fighter A
                <span>VS</span>
                Fighter B
            </div>

            <div
                id="previewInfo"
                class="preview-info"
            >
                Kies twee fighters
            </div>

        </div>


        <!-- BUTTON -->

        <button
            class="create-button"
            onclick="createFight()"
        >

            🥊 Fight toevoegen aan event

        </button>


        <div
            id="success"
            class="success"
        >

            Fight succesvol toegevoegd! 🔥

        </div>


    </div>

</div>


<script>


/*
==================================================
DATA
==================================================
*/

let fighters =
    JSON.parse(
        localStorage.getItem("fighters")
    ) || [];


let events =
    JSON.parse(
        localStorage.getItem("events")
    ) || [];


/*
==================================================
FIGHTERS IN DROPDOWNS
==================================================
*/

function loadFighters() {

    const fighterA =
        document.getElementById(
            "fighterA"
        );

    const fighterB =
        document.getElementById(
            "fighterB"
        );


    fighters.forEach(
        fighter => {

            const optionA =
                document.createElement(
                    "option"
                );

            optionA.value =
                fighter.id;

            optionA.textContent =
                fighter.name +
                " (" +
                fighter.weightClass +
                ")";

            fighterA.appendChild(
                optionA
            );


            const optionB =
                document.createElement(
                    "option"
                );

            optionB.value =
                fighter.id;

            optionB.textContent =
                fighter.name +
                " (" +
                fighter.weightClass +
                ")";

            fighterB.appendChild(
                optionB
            );

        }
    );

}


/*
==================================================
EVENTS IN DROPDOWN
==================================================
*/

function loadEvents() {

    const eventSelect =
        document.getElementById(
            "event"
        );


    if (events.length === 0) {

        eventSelect.innerHTML = `

            <option value="">
                Geen events beschikbaar
            </option>

        `;

        return;

    }


    events.forEach(
        event => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                event.id;

            option.textContent =
                event.name;

            eventSelect.appendChild(
                option
            );

        }
    );

}


/*
==================================================
PREVIEW
==================================================
*/

function updatePreview() {

    const fighterAId =
        document.getElementById(
            "fighterA"
        ).value;


    const fighterBId =
        document.getElementById(
            "fighterB"
        ).value;


    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const fighterA =
        fighters.find(
            fighter =>
                fighter.id == fighterAId
        );


    const fighterB =
        fighters.find(
            fighter =>
                fighter.id == fighterBId
        );


    const preview =
        document.getElementById(
            "previewFight"
        );


    const info =
        document.getElementById(
            "previewInfo"
        );


    if (!fighterA || !fighterB) {

        preview.innerHTML =
            `
                Fighter A
                <span>VS</span>
                Fighter B
            `;

        info.textContent =
            "Kies twee fighters";

        return;

    }


    preview.innerHTML = `

        ${fighterA.name}

        <span>
            VS
        </span>

        ${fighterB.name}

    `;


    info.textContent =
        weightClass +
        " • " +
        fighterA.wins +
        "-" +
        fighterA.losses +
        "-" +
        fighterA.draws +
        " vs " +
        fighterB.wins +
        "-" +
        fighterB.losses +
        "-" +
        fighterB.draws;

}


/*
==================================================
FIGHT MAKEN
==================================================
*/

function createFight() {

    const fighterAId =
        document.getElementById(
            "fighterA"
        ).value;


    const fighterBId =
        document.getElementById(
            "fighterB"
        ).value;


    const weightClass =
        document.getElementById(
            "weightClass"
        ).value;


    const rounds =
        Number(
            document.getElementById(
                "rounds"
            ).value
        );


    const eventId =
        document.getElementById(
            "event"
        ).value;


    const championship =
        document.getElementById(
            "championship"
        ).checked;


    const mainEvent =
        document.getElementById(
            "mainEvent"
        ).checked;


    /*
    ------------------------------------------
    VALIDATIE
    ------------------------------------------
    */

    if (!fighterAId || !fighterBId) {

        alert(
            "Kies twee fighters."
        );

        return;

    }


    if (fighterAId === fighterBId) {

        alert(
            "Een fighter kan niet tegen zichzelf vechten."
        );

        return;

    }


    if (!eventId) {

        alert(
            "Kies een event."
        );

        return;

    }


    const fighterA =
        fighters.find(
            fighter =>
                fighter.id == fighterAId
        );


    const fighterB =
        fighters.find(
            fighter =>
                fighter.id == fighterBId
        );


    const event =
        events.find(
            event =>
                event.id == eventId
        );


    if (!fighterA || !fighterB || !event) {

        alert(
            "Er ging iets mis."
        );

        return;

    }


    /*
    ------------------------------------------
    MAIN EVENT
    ------------------------------------------
    */

    if (mainEvent) {

        event.fights.forEach(
            fight => {

                fight.mainEvent =
                    false;

            }
        );

    }


    /*
    ------------------------------------------
    FIGHT OBJECT
    ------------------------------------------
    */

    const fight = {

        id: Date.now(),

        fighterA:
            fighterA.id,

        fighterB:
            fighterB.id,

        weightClass:
            weightClass,

        rounds:
            rounds,

        championship:
            championship,

        mainEvent:
            mainEvent,

        result:
            null

    };


    event.fights.push(
        fight
    );


    /*
    ------------------------------------------
    OPSLAAN
    ------------------------------------------
    */

    localStorage.setItem(
        "events",
        JSON.stringify(events)
    );


    /*
    ------------------------------------------
    SUCCESS
    ------------------------------------------
    */

    const success =
        document.getElementById(
            "success"
        );


    success.style.display =
        "block";


    setTimeout(
        () => {

            success.style.display =
                "none";

        },
        3000
    );


    /*
    FORMULIER RESETTEN
    */

    document.getElementById(
        "fighterA"
    ).value = "";


    document.getElementById(
        "fighterB"
    ).value = "";


    document.getElementById(
        "championship"
    ).checked = false;


    document.getElementById(
        "mainEvent"
    ).checked = false;


    updatePreview();

}


/*
==================================================
START
==================================================
*/

loadFighters();

loadEvents();

updatePreview();


</script>


</body>
</html>
