<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighters - MMA Matchmaker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        header {
            background: #111;
            border-bottom: 2px solid #e10600;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #e10600;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            color: #e10600;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .form {
            background: #151515;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 40px;
        }

        .form h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #e10600;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #ff211a;
        }

        .fighter {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .fighter h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .stats {
            display: flex;
            gap: 20px;
            color: #aaa;
            flex-wrap: wrap;
        }

        .record {
            color: white;
        }

        .wins {
            color: #35d07f;
        }

        .losses {
            color: #e10600;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .actions button {
            margin-top: 0;
        }

        .delete {
            background: #333;
        }

        .delete:hover {
            background: #555;
        }

        .empty {
            color: #777;
            margin-top: 20px;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        MMA <span>MATCHMAKER</span>
    </div>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="fighters.html">Fighters</a>
        <a href="#">Rankings</a>
        <a href="#">Events</a>
        <a href="#">Matchmaker</a>
    </nav>

</header>


<div class="container">

    <h1>🥊 Fighters</h1>


    <!-- FIGHTER TOEVOEGEN -->

    <div class="form">

        <h2>Nieuwe fighter toevoegen</h2>

        <div class="form-grid">

            <input
                id="name"
                type="text"
                placeholder="Naam"
            >

            <select id="weightClass">

                <option value="">
                    Gewichtsklasse
                </option>

                <option>Flyweight</option>
                <option>Bantamweight</option>
                <option>Featherweight</option>
                <option>Lightweight</option>
                <option>Welterweight</option>
                <option>Middleweight</option>
                <option>Light Heavyweight</option>
                <option>Heavyweight</option>

            </select>

            <input
                id="wins"
                type="number"
                placeholder="Wins"
                value="0"
                min="0"
            >

            <input
                id="losses"
                type="number"
                placeholder="Losses"
                value="0"
                min="0"
            >

            <input
                id="draws"
                type="number"
                placeholder="Draws"
                value="0"
                min="0"
            >

            <input
                id="ranking"
                type="number"
                placeholder="Ranking"
                min="1"
            >

            <input
                id="streak"
                type="number"
                placeholder="Win streak"
                value="0"
                min="0"
            >

        </div>

        <button onclick="addFighter()">
            + Fighter toevoegen
        </button>

    </div>


    <!-- FIGHTER LIJST -->

    <h2>Fighter roster</h2>

    <div id="fighterList"></div>

</div>


<script>

    /*
    ==========================================
    FIGHTER DATA
    ==========================================
    */

    let fighters =
        JSON.parse(localStorage.getItem("fighters")) || [];


    /*
    ==========================================
    DATA OPSLAAN
    ==========================================
    */

    function saveFighters() {

        localStorage.setItem(
            "fighters",
            JSON.stringify(fighters)
        );

    }


    /*
    ==========================================
    FIGHTER TOEVOEGEN
    ==========================================
    */

    function addFighter() {

        const name =
            document.getElementById("name").value.trim();

        const weightClass =
            document.getElementById("weightClass").value;

        const wins =
            Number(document.getElementById("wins").value);

        const losses =
            Number(document.getElementById("losses").value);

        const draws =
            Number(document.getElementById("draws").value);

        const ranking =
            document.getElementById("ranking").value;

        const streak =
            Number(document.getElementById("streak").value);


        if (!name) {

            alert("Vul een naam in.");

            return;
        }


        if (!weightClass) {

            alert("Kies een gewichtsklasse.");

            return;
        }


        const fighter = {

            id: Date.now(),

            name: name,

            weightClass: weightClass,

            wins: wins,

            losses: losses,

            draws: draws,

            ranking: ranking,

            streak: streak

        };


        fighters.push(fighter);


        saveFighters();

        displayFighters();


        /*
        FORMULIER LEGEN
        */

        document.getElementById("name").value = "";

        document.getElementById("weightClass").value = "";

        document.getElementById("wins").value = "0";

        document.getElementById("losses").value = "0";

        document.getElementById("draws").value = "0";

        document.getElementById("ranking").value = "";

        document.getElementById("streak").value = "0";

    }


    /*
    ==========================================
    FIGHTER BEWERKEN
    ==========================================
    */

    function editFighter(id) {

        const fighter =
            fighters.find(
                fighter => fighter.id === id
            );


        if (!fighter) {

            return;

        }


        const name =
            prompt(
                "Naam:",
                fighter.name
            );


        if (name === null) return;


        const weightClass =
            prompt(
                "Gewichtsklasse:",
                fighter.weightClass
            );


        if (weightClass === null) return;


        const wins =
            prompt(
                "Wins:",
                fighter.wins
            );


        if (wins === null) return;


        const losses =
            prompt(
                "Losses:",
                fighter.losses
            );


        if (losses === null) return;


        const draws =
            prompt(
                "Draws:",
                fighter.draws
            );


        if (draws === null) return;


        const ranking =
            prompt(
                "Ranking (leeg = unranked):",
                fighter.ranking
            );


        if (ranking === null) return;


        const streak =
            prompt(
                "Win streak:",
                fighter.streak
            );


        if (streak === null) return;


        /*
        GEGEVENS AANPASSEN
        */

        fighter.name =
            name.trim();


        fighter.weightClass =
            weightClass;


        fighter.wins =
            Number(wins);


        fighter.losses =
            Number(losses);


        fighter.draws =
            Number(draws);


        fighter.ranking =
            ranking;


        fighter.streak =
            Number(streak);


        saveFighters();

        displayFighters();

    }


    /*
    ==========================================
    FIGHTER VERWIJDEREN
    ==========================================
    */

    function deleteFighter(id) {

        const fighter =
            fighters.find(
                fighter => fighter.id === id
            );


        if (!fighter) return;


        const confirmDelete =
            confirm(
                "Wil je " +
                fighter.name +
                " verwijderen?"
            );


        if (!confirmDelete) {

            return;

        }


        fighters =
            fighters.filter(
                fighter => fighter.id !== id
            );


        saveFighters();

        displayFighters();

    }


    /*
    ==========================================
    FIGHTERS WEERGEVEN
    ==========================================
    */

    function displayFighters() {

        const list =
            document.getElementById(
                "fighterList"
            );


        list.innerHTML = "";


        if (fighters.length === 0) {

            list.innerHTML = `
                <p class="empty">
                    Nog geen fighters toegevoegd.
                </p>
            `;

            return;

        }


        fighters.forEach(fighter => {

            const rankingText =
                fighter.ranking
                    ? "#" + fighter.ranking
                    : "Unranked";


            list.innerHTML += `

                <div class="fighter">

                    <h3>
                        ${fighter.name}
                    </h3>


                    <div class="stats">

                        <span>
                            ${fighter.weightClass}
                        </span>


                        <span>
                            Ranking:
                            ${rankingText}
                        </span>


                        <span class="record">

                            Record:

                            <span class="wins">
                                ${fighter.wins}
                            </span>

                            -

                            <span class="losses">
                                ${fighter.losses}
                            </span>

                            -

                            ${fighter.draws}

                        </span>


                        <span>
                            Win streak:
                            ${fighter.streak}
                        </span>

                    </div>


                    <div class="actions">

                        <button
                            onclick="editFighter(${fighter.id})"
                        >
                            ✏️ Bewerken
                        </button>


                        <button
                            class="delete"
                            onclick="deleteFighter(${fighter.id})"
                        >
                            🗑️ Verwijderen
                        </button>

                    </div>

                </div>

            `;

        });

    }


    /*
    ==========================================
    PAGINA LADEN
    ==========================================
    */

    displayFighters();

</script>

</body>
</html>
